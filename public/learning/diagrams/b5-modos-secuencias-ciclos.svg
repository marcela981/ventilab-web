<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="t d">
<title id="t">Secuencias de ciclos: CMV, IMV y CSV</title>
<desc id="d">Tres trazados esquemáticos de presión en la vía aérea frente al tiempo. En CMV todos los ciclos son mandatorios; algunos los dispara el tiempo y otros el esfuerzo del paciente, señalado por una pequeña deflexión negativa previa. En IMV se intercalan ciclos mandatorios con ciclos espontáneos más pequeños. En CSV todos los ciclos son espontáneos, disparados y ciclados por el paciente.</desc>
