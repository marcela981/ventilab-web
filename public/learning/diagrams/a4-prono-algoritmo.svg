<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Algoritmo de indicación del prono</title>
<desc id="d">Diagrama de flujo vertical. SDRA con ventilación invasiva, luego estabilización con volumen corriente bajo y PEEP ajustada. Decisión: PaO2/FiO2 menor de 150 mmHg con PEEP de al menos 5; si no, continuar y reevaluar. Decisión: fractura vertebral inestable; si la hay, no pronar. Si no la hay, sesión de prono de al menos 16 horas. Después, en supino al menos 4 horas, decisión: PaO2/FiO2 de al menos 150 con PEEP de hasta 10 y FiO2 de hasta 0,6; si se cumple, suspender las sesiones; si no, repetir la sesión al día siguiente.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><text x="360" y="32" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Indicación y seguimiento del decúbito prono</text><rect x="40" y="50" width="380" height="40" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="230" y="75" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">SDRA con ventilación invasiva</text><rect x="40" y="110" width="380" height="58" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><text x="230" y="135" font-size="14" fill="#1f2937" text-anchor="middle">Estabilización: Vt bajo, PEEP ajustada,</text><text x="230" y="153" font-size="14" fill="#1f2937" text-anchor="middle">Pplat controlada</text><rect x="40" y="188" width="380" height="58" rx="18" fill="#ffffff" stroke="#c2410c" stroke-width="2.5"/><text x="230" y="213" font-size="14" fill="#1f2937" text-anchor="middle">¿PaO₂/FiO₂ &lt; 150 mmHg</text><text x="230" y="231" font-size="14" fill="#1f2937" text-anchor="middle">con PEEP ≥ 5 cmH₂O?</text><rect x="40" y="270" width="380" height="58" rx="18" fill="#ffffff" stroke="#c2410c" stroke-width="2.5"/><text x="230" y="295" font-size="14" fill="#1f2937" text-anchor="middle">¿Fractura vertebral inestable</text><text x="230" y="313" font-size="14" fill="#1f2937" text-anchor="middle">(contraindicación absoluta)?</text><rect x="40" y="352" width="380" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="230" y="377" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">Sesión de prono ≥ 16 horas</text><rect x="40" y="414" width="380" height="76" rx="18" fill="#ffffff" stroke="#c2410c" stroke-width="2.5"/><text x="230" y="439" font-size="14" fill="#1f2937" text-anchor="middle">Supino ≥ 4 h: ¿PaO₂/FiO₂ ≥ 150 mmHg</text><text x="230" y="457" font-size="14" fill="#1f2937" text-anchor="middle">con PEEP ≤ 10 cmH₂O</text><text x="230" y="475" font-size="14" fill="#1f2937" text-anchor="middle">y FiO₂ ≤ 0,6?</text><rect x="470" y="188" width="220" height="58" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><text x="580" y="213" font-size="14" fill="#1f2937" text-anchor="middle">Continuar ventilación</text><text x="580" y="231" font-size="14" fill="#1f2937" text-anchor="middle">protectora y reevaluar</text><rect x="470" y="270" width="220" height="58" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="580" y="295" font-size="14" fill="#1f2937" text-anchor="middle">No pronar; valorar</text><text x="580" y="313" font-size="14" fill="#1f2937" text-anchor="middle">otras estrategias</text><rect x="470" y="424" width="220" height="56" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="580" y="448" font-size="14" fill="#1f2937" text-anchor="middle">Suspender las</text><text x="580" y="466" font-size="14" fill="#1f2937" text-anchor="middle">sesiones de prono</text><line x1="230" y1="90" x2="230" y2="108" stroke="#1f2937" stroke-width="2" marker-end="url(#af)"/><line x1="230" y1="168" x2="230" y2="186" stroke="#1f2937" stroke-width="2" marker-end="url(#af)"/><line x1="230" y1="246" x2="230" y2="268" stroke="#1f2937" stroke-width="2" marker-end="url(#af)"/><text x="238" y="262" font-size="14" fill="#1f2937" font-weight="600">Sí</text><line x1="230" y1="328" x2="230" y2="350" stroke="#1f2937" stroke-width="2" marker-end="url(#af)"/><text x="238" y="344" font-size="14" fill="#1f2937" font-weight="600">No</text><line x1="230" y1="392" x2="230" y2="412" stroke="#1f2937" stroke-width="2" marker-end="url(#af)"/><line x1="420" y1="217" x2="468" y2="217" stroke="#1f2937" stroke-width="2" marker-end="url(#af)"/><text x="432" y="210" font-size="14" fill="#1f2937" font-weight="600">No</text><line x1="420" y1="299" x2="468" y2="299" stroke="#1f2937" stroke-width="2" marker-end="url(#af)"/><text x="432" y="292" font-size="14" fill="#1f2937" font-weight="600">Sí</text><line x1="420" y1="452" x2="468" y2="452" stroke="#1f2937" stroke-width="2" marker-end="url(#af)"/><text x="432" y="445" font-size="14" fill="#1f2937" font-weight="600">Sí</text><path d="M 40 452 L 18 452 L 18 372 L 38 372" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#af)"/><text x="24" y="506" font-size="14" fill="#1f2937" font-weight="600">No: repetir la sesión al día siguiente</text><text x="40" y="536" font-size="13" fill="#1f2937">Criterios basados en el ensayo PROSEVA y en la guía ESICM 2023; aplica el protocolo de tu unidad.</text><text x="40" y="554" font-size="13" fill="#1f2937">Suspende también si la PaO₂/FiO₂ cae más del 20 % frente al supino o hay una complicación grave.</text>
</svg>
