<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d">
  <title id="t">Palancas del ventilador para la oxigenación y la ventilación</title>
  <desc id="d">Dos columnas. Columna izquierda, oxigenación medida por PaO2 y PaO2/FiO2: se corrige con FiO2, PEEP y presión media de la vía aérea, incluido el tiempo inspiratorio; el problema dominante es el shunt. Columna derecha, ventilación medida por PaCO2 y pH: se corrige con la ventilación alveolar, que depende de frecuencia respiratoria y volumen corriente menos espacio muerto; sus límites son la presión meseta y la auto-PEEP. Abajo, una advertencia: no corrijas la hipoxemia con la frecuencia ni la hipercapnia con la FiO2.</desc>
  <rect width="100%" height="100%" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937">
    <text x="360" y="34" font-size="18" font-weight="bold" text-anchor="middle">Dos problemas, dos grupos de palancas</text>

    <!-- Oxygenation column -->
    <rect x="30" y="56" width="315" height="290" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="187" y="88" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Oxigenación</text>
    <text x="187" y="112" font-size="14" text-anchor="middle">se mide con PaO₂, PaO₂/FiO₂, SpO₂</text>
    <g font-size="15">
      <rect x="50" y="130" width="275" height="38" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
      <text x="187" y="155" text-anchor="middle">FiO₂</text>
      <rect x="50" y="178" width="275" height="38" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
      <text x="187" y="203" text-anchor="middle">PEEP (abre y mantiene alvéolos)</text>
      <rect x="50" y="226" width="275" height="38" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
      <text x="187" y="251" text-anchor="middle">Presión media (Ti, PEEP)</text>
    </g>
    <text x="187" y="296" font-size="14" text-anchor="middle">Problema típico: shunt y</text>
    <text x="187" y="316" font-size="14" text-anchor="middle">baja relación V/Q</text>

    <!-- Ventilation column -->
    <rect x="375" y="56" width="315" height="290" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="532" y="88" font-size="18" font-weight="bold" text-anchor="middle" fill="#15803d">Ventilación</text>
    <text x="532" y="112" font-size="14" text-anchor="middle">se mide con PaCO₂ y pH</text>
    <g font-size="15">
      <rect x="395" y="130" width="275" height="38" rx="8" fill="#ffffff" stroke="#15803d"/>
      <text x="532" y="155" text-anchor="middle">Frecuencia respiratoria</text>
      <rect x="395" y="178" width="275" height="38" rx="8" fill="#ffffff" stroke="#15803d"/>
      <text x="532" y="203" text-anchor="middle">Volumen corriente</text>
      <rect x="395" y="226" width="275" height="38" rx="8" fill="#ffffff" stroke="#15803d"/>
      <text x="532" y="251" text-anchor="middle">Reducir espacio muerto</text>
    </g>
    <text x="532" y="296" font-size="14" text-anchor="middle">V̇A = (VT − VD) · FR</text>
    <text x="532" y="316" font-size="14" text-anchor="middle">Límites: Pplat y auto-PEEP</text>

    <!-- warning -->
    <rect x="30" y="364" width="660" height="54" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="360" y="388" font-size="15" text-anchor="middle" fill="#b91c1c" font-weight="bold">Error típico: corregir la hipoxemia con la FR</text>
    <text x="360" y="408" font-size="15" text-anchor="middle" fill="#b91c1c">o la hipercapnia con la FiO₂</text>
  </g>
</svg>
