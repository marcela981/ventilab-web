<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
  <title id="t">Disparo por presión frente a disparo por flujo</title>
  <desc id="d">Dos paneles. A la izquierda, disparo por presión: la presión en la vía aérea parte de la PEEP, desciende por el esfuerzo del paciente hasta cruzar el umbral de presión programado por debajo de la PEEP, y en ese punto el ventilador inicia la inspiración y la presión sube. A la derecha, disparo por flujo: el flujo en el circuito parte de cero, el esfuerzo del paciente genera un flujo inspiratorio que cruza el umbral de flujo programado y en ese punto se inicia la inspiración, con una caída de presión mínima.</desc>
  <rect width="100%" height="100%" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937">
    <text x="200" y="36" font-size="16" font-weight="600" text-anchor="middle">A. Disparo por presión</text>
    <text x="540" y="36" font-size="16" font-weight="600" text-anchor="middle">B. Disparo por flujo</text>
    <line x1="370" y1="20" x2="370" y2="380" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

    <!-- Panel A -->
    <line x1="60" y1="70" x2="60" y2="290" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="60" y1="290" x2="350" y2="290" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="26" y="180" font-size="13" transform="rotate(-90 26 180)" text-anchor="middle">Paw (cmH₂O)</text>
    <text x="345" y="310" font-size="13" text-anchor="end">Tiempo (s)</text>
    <line x1="60" y1="200" x2="350" y2="200" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="66" y="194" font-size="14" fill="#15803d">PEEP</text>
    <line x1="60" y1="232" x2="350" y2="232" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="66" y="252" font-size="14" fill="#b91c1c">umbral de presión</text>
    <path d="M60,200 L150,200 C165,205 175,224 188,232 L198,110 L300,110 L310,200 L350,200" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="188" cy="232" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="2.5"/>
    <text x="205" y="262" font-size="14" fill="#6d28d9">disparo</text>
    <text x="152" y="160" font-size="14" text-anchor="end">esfuerzo del</text>
    <text x="152" y="178" font-size="14" text-anchor="end">paciente</text>
    <text x="250" y="100" font-size="14" text-anchor="middle">asistencia</text>
    <text x="60" y="345" font-size="14">El paciente debe bajar la presión</text>
    <text x="60" y="365" font-size="14">del circuito hasta el umbral.</text>

    <!-- Panel B -->
    <line x1="400" y1="70" x2="400" y2="290" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="400" y1="220" x2="700" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="388" y="180" font-size="13" transform="rotate(-90 388 180)" text-anchor="middle">Flujo (L/min)</text>
    <text x="695" y="288" font-size="13" text-anchor="end">Tiempo (s)</text>
    <text x="406" y="214" font-size="14">0</text>
    <line x1="400" y1="196" x2="700" y2="196" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="404" y="186" font-size="14" fill="#b91c1c">umbral de flujo</text>
    <path d="M400,220 L480,220 C490,216 500,204 508,196 L516,100 C560,130 600,180 640,212 L646,220 L646,262 C664,236 680,224 700,221" fill="none" stroke="#c2410c" stroke-width="3"/>
    <circle cx="508" cy="196" r="6" fill="#ffffff" stroke="#6d28d9" stroke-width="2.5"/>
    <text x="460" y="262" font-size="14" fill="#6d28d9" text-anchor="middle">disparo</text>
    <line x1="470" y1="250" x2="503" y2="203" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="528" y="96" font-size="14">flujo entregado</text>
    <text x="400" y="345" font-size="14">El ventilador detecta el flujo que</text>
    <text x="400" y="365" font-size="14">el paciente toma del circuito.</text>
  </g>
</svg>
