<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Zonas de la vía aérea según las generaciones de división</title>
<desc id="d">Esquema de barras que muestra las generaciones de la vía aérea de 0 a 23. De la tráquea (generación 0) a los bronquiolos terminales (generación 16) se extiende la zona de conducción, sin intercambio gaseoso, que constituye el espacio muerto anatómico. De los bronquiolos respiratorios (generación 17) a los sacos alveolares (generación 23) se extiende la zona respiratoria o acino, donde ocurre el intercambio. El área de sección transversal total aumenta de forma muy marcada en la zona respiratoria. Esquema cualitativo, no a escala.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<text x="360" y="36" font-size="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" text-anchor="middle" font-weight="600">Generaciones de la vía aérea y zonas funcionales</text>
<rect x="40" y="60" width="450.3" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
<rect x="496.3" y="60" width="183.7" height="40" rx="6" fill="#dcfce7" stroke="#15803d"/>
