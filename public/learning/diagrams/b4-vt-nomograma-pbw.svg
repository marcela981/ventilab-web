<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Nomograma del peso corporal predicho</title>
<desc id="d">Gráfico de líneas del peso corporal predicho en kilogramos frente a la talla de 150 a 200 cm. Dos rectas paralelas: hombres (50 + 0,91 por talla menos 152,4) y mujeres (4,5 kg menos). Se marcan dos ejemplos: mujer de 160 cm con unos 52 kg y hombre de 175 cm con unos 71 kg.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<text x="360" y="32" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Peso corporal predicho (PBW) según talla y sexo</text><line x1="80" y1="340" x2="80" y2="60" stroke="#9ca3af" stroke-width="1"/><text x="80" y="362" font-size="13" fill="#1f2937" text-anchor="middle">150</text><line x1="200" y1="340" x2="200" y2="60" stroke="#9ca3af" stroke-width="1"/><text x="200" y="362" font-size="13" fill="#1f2937" text-anchor="middle">160</text><line x1="320" y1="340" x2="320" y2="60" stroke="#9ca3af" stroke-width="1"/><text x="320" y="362" font-size="13" fill="#1f2937" text-anchor="middle">170</text><line x1="440" y1="340" x2="440" y2="60" stroke="#9ca3af" stroke-width="1"/><text x="440" y="362" font-size="13" fill="#1f2937" text-anchor="middle">180</text><line x1="560" y1="340" x2="560" y2="60" stroke="#9ca3af" stroke-width="1"/><text x="560" y="362" font-size="13" fill="#1f2937" text-anchor="middle">190</text><line x1="680" y1="340" x2="680" y2="60" stroke="#9ca3af" stroke-width="1"/><text x="680" y="362" font-size="13" fill="#1f2937" text-anchor="middle">200</text><line x1="80" y1="340" x2="680" y2="340" stroke="#9ca3af" stroke-width="1"/><text x="70" y="345" font-size="13" fill="#1f2937" text-anchor="end">40</text><line x1="80" y1="293.3" x2="680" y2="293.3" stroke="#9ca3af" stroke-width="1"/><text x="70" y="298.3" font-size="13" fill="#1f2937" text-anchor="end">50</text><line x1="80" y1="246.7" x2="680" y2="246.7" stroke="#9ca3af" stroke-width="1"/><text x="70" y="251.7" font-size="13" fill="#1f2937" text-anchor="end">60</text><line x1="80" y1="200" x2="680" y2="200" stroke="#9ca3af" stroke-width="1"/><text x="70" y="205" font-size="13" fill="#1f2937" text-anchor="end">70</text><line x1="80" y1="153.3" x2="680" y2="153.3" stroke="#9ca3af" stroke-width="1"/><text x="70" y="158.3" font-size="13" fill="#1f2937" text-anchor="end">80</text><line x1="80" y1="106.7" x2="680" y2="106.7" stroke="#9ca3af" stroke-width="1"/><text x="70" y="111.7" font-size="13" fill="#1f2937" text-anchor="end">90</text><line x1="80" y1="60" x2="680" y2="60" stroke="#9ca3af" stroke-width="1"/><text x="70" y="65" font-size="13" fill="#1f2937" text-anchor="end">100</text><line x1="80" y1="340" x2="680" y2="340" stroke="#1f2937" stroke-width="1.5"/><line x1="80" y1="340" x2="80" y2="60" stroke="#1f2937" stroke-width="1.5"/><text x="380" y="388" font-size="14" fill="#1f2937" text-anchor="middle">Talla (cm)</text><text x="26" y="200" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 26 200)">PBW (kg)</text><polyline points="80,303.5 680,91.2" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/><polyline points="80,324.5 680,112.2" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 5"/><text x="98" y="88" font-size="14" fill="#1d4ed8">Hombres (línea continua): 50 + 0,91 × (talla − 152,4)</text><text x="668" y="321.3" font-size="14" fill="#6d28d9" text-anchor="end">Mujeres (línea discontinua): 45,5 + 0,91 × (talla − 152,4)</text><line x1="200" y1="340" x2="200" y2="282.1" stroke="#6d28d9" stroke-width="1" stroke-dasharray="3 4"/><line x1="80" y1="282.1" x2="200" y2="282.1" stroke="#6d28d9" stroke-width="1" stroke-dasharray="3 4"/><circle cx="200" cy="282.1" r="5" fill="#6d28d9"/><text x="208" y="304.1" font-size="14" fill="#6d28d9" text-anchor="start">Mujer 160 cm ≈ 52 kg</text><line x1="380" y1="340" x2="380" y2="197.4" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 4"/><line x1="80" y1="197.4" x2="380" y2="197.4" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 4"/><circle cx="380" cy="197.4" r="5" fill="#1d4ed8"/><text x="370" y="185.4" font-size="14" fill="#1d4ed8" text-anchor="end">Hombre 175 cm ≈ 71 kg</text><text x="360" y="410" font-size="14" fill="#1f2937" text-anchor="middle">El PBW depende solo de la talla y el sexo: el peso real no entra en la fórmula.</text>
</svg>
