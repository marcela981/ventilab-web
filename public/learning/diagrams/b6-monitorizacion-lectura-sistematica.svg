<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d">
  <title id="t">Lectura sistemática del monitor del ventilador</title>
  <desc id="d">Diagrama de flujo en seis pasos dispuestos en dos filas: 1 escalas y unidades, 2 identificar el modo, 3 disparo y sincronía, 4 mecánica con pico, meseta y PEEP, 5 espiración completa y volumen que vuelve a la base, 6 correlacionar con el paciente y decidir. Una flecha regresa del paso 6 al paso 1 con la indicación de reevaluar tras cada ajuste.</desc>
  <rect width="100%" height="100%" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" font-size="14">
    <!-- row 1 -->
    <rect x="30" y="50" width="200" height="120" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="130" y="80" text-anchor="middle" font-weight="bold">1. Escalas y unidades</text>
    <text x="130" y="108" text-anchor="middle">¿Curvas completas,</text>
    <text x="130" y="128" text-anchor="middle">sin recortar?</text>

    <rect x="260" y="50" width="200" height="120" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="360" y="80" text-anchor="middle" font-weight="bold">2. Modo</text>
    <text x="360" y="108" text-anchor="middle">¿Qué controla el</text>
    <text x="360" y="128" text-anchor="middle">ventilador: flujo o</text>
    <text x="360" y="148" text-anchor="middle">presión?</text>

    <rect x="490" y="50" width="200" height="120" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="590" y="80" text-anchor="middle" font-weight="bold">3. Disparo y sincronía</text>
    <text x="590" y="108" text-anchor="middle">¿Esfuerzos del</text>
    <text x="590" y="128" text-anchor="middle">paciente? ¿Ciclos</text>
    <text x="590" y="148" text-anchor="middle">sin esfuerzo?</text>

    <!-- row 2 -->
    <rect x="490" y="240" width="200" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="590" y="270" text-anchor="middle" font-weight="bold">4. Mecánica</text>
    <text x="590" y="298" text-anchor="middle">Pico, meseta, PEEP</text>
    <text x="590" y="318" text-anchor="middle">total: resistiva frente</text>
    <text x="590" y="338" text-anchor="middle">a elástica</text>

    <rect x="260" y="240" width="200" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="360" y="270" text-anchor="middle" font-weight="bold">5. Espiración</text>
    <text x="360" y="298" text-anchor="middle">¿El flujo llega a cero?</text>
    <text x="360" y="318" text-anchor="middle">¿El volumen vuelve</text>
    <text x="360" y="338" text-anchor="middle">a la base?</text>

    <rect x="30" y="240" width="200" height="120" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="130" y="270" text-anchor="middle" font-weight="bold">6. Paciente y decisión</text>
    <text x="130" y="298" text-anchor="middle">Exploración, SpO₂,</text>
    <text x="130" y="318" text-anchor="middle">hemodinamia, gases;</text>
    <text x="130" y="338" text-anchor="middle">ajusta o trata</text>

    <!-- arrows -->
    <line x1="230" y1="110" x2="256" y2="110" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="460" y1="110" x2="486" y2="110" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="590" y1="170" x2="590" y2="236" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="490" y1="300" x2="464" y2="300" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="260" y1="300" x2="234" y2="300" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M130,360 L130,400 L15,400 L15,110 L26,110" fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
    <text x="150" y="420" fill="#6d28d9">Reevalúa tras cada ajuste: vuelve al paso 1</text>
    <text x="360" y="30" text-anchor="middle" font-weight="bold">Siempre en el mismo orden</text>
  </g>
</svg>
