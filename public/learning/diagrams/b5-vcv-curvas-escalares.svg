<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="t d">
<title id="t">Curvas escalares en ventilación controlada por volumen</title>
<desc id="d">Tres gráficas apiladas de presión, flujo y volumen frente al tiempo durante dos ciclos de VCV con flujo constante. La presión sube en rampa lineal hasta la presión pico, cae a una meseta durante la pausa inspiratoria y regresa a la PEEP en la espiración. El flujo inspiratorio es cuadrado, es cero durante la pausa y el espiratorio es pasivo y decreciente. El volumen sube linealmente, se mantiene en la pausa y desciende de forma exponencial.</desc>
