<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="t d">
<title id="t">Esquema simplificado para elegir el tipo de soporte respiratorio</title>
<desc id="d">Algoritmo. Ante una insuficiencia respiratoria aguda, primero se pregunta si hay indicación inmediata de intubación: paro respiratorio, coma con vía aérea no protegida, shock grave o imposibilidad de usar mascarilla. Si la hay, ventilación invasiva. Si no, se pregunta si es hipercápnica con acidosis, pH igual o menor de 7,35. Si lo es, ventilación no invasiva binivel. Si es hipoxémica, cánula nasal de alto flujo o ventilación no invasiva según la causa, por ejemplo CPAP o binivel en el edema pulmonar cardiogénico. Ambas ramas llevan a una reevaluación precoz de pH, frecuencia respiratoria, trabajo respiratorio y conciencia. Si hay fracaso, intubación sin demora.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" font-size="14">
  <!-- start -->
  <rect x="40" y="20" width="400" height="40" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <text x="240" y="45" text-anchor="middle" font-weight="600">Insuficiencia respiratoria aguda</text>
  <line x1="240" y1="60" x2="240" y2="80" stroke="#1f2937" stroke-width="2"/>
  <polygon points="234,78 246,78 240,88" fill="#1f2937"/>

  <!-- q1 -->
  <rect x="40" y="90" width="400" height="84" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="240" y="112" text-anchor="middle" font-weight="600">¿Indicación inmediata de intubación?</text>
  <text x="240" y="132" text-anchor="middle">Paro respiratorio, coma con vía aérea</text>
  <text x="240" y="148" text-anchor="middle">no protegida, shock grave,</text>
  <text x="240" y="164" text-anchor="middle">imposibilidad de usar mascarilla</text>

  <!-- invasive box -->
  <rect x="500" y="100" width="190" height="64" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="595" y="128" text-anchor="middle" font-weight="600">Ventilación</text>
  <text x="595" y="148" text-anchor="middle" font-weight="600">invasiva</text>
  <line x1="440" y1="132" x2="490" y2="132" stroke="#b91c1c" stroke-width="2"/>
  <polygon points="488,126 488,138 498,132" fill="#b91c1c"/>
  <text x="466" y="124" text-anchor="middle">Sí</text>

  <line x1="240" y1="174" x2="240" y2="200" stroke="#1f2937" stroke-width="2"/>
  <polygon points="234,198 246,198 240,208" fill="#1f2937"/>
  <text x="256" y="194">No</text>

  <!-- q2 -->
  <rect x="40" y="210" width="400" height="48" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="240" y="232" text-anchor="middle" font-weight="600">¿Tipo de insuficiencia?</text>
  <text x="240" y="250" text-anchor="middle">Hipercápnica con acidosis o hipoxémica</text>
  <line x1="140" y1="258" x2="140" y2="282" stroke="#1f2937" stroke-width="2"/>
  <polygon points="134,280 146,280 140,290" fill="#1f2937"/>
  <line x1="340" y1="258" x2="340" y2="282" stroke="#1f2937" stroke-width="2"/>
  <polygon points="334,280 346,280 340,290" fill="#1f2937"/>

  <!-- branches -->
  <rect x="30" y="292" width="210" height="84" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="135" y="314" text-anchor="middle" font-weight="600">Hipercápnica</text>
  <text x="135" y="332" text-anchor="middle">pH ≤ 7,35</text>
  <text x="135" y="352" text-anchor="middle">VNI binivel</text>
  <text x="135" y="368" text-anchor="middle">(p. ej., EPOC)</text>
  <rect x="250" y="292" width="200" height="84" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="350" y="314" text-anchor="middle" font-weight="600">Hipoxémica</text>
  <text x="350" y="332" text-anchor="middle">CNAF o VNI</text>
  <text x="350" y="350" text-anchor="middle">según la causa</text>
  <text x="350" y="368" text-anchor="middle">(edema: CPAP/binivel)</text>
  <line x1="135" y1="376" x2="135" y2="400" stroke="#1f2937" stroke-width="2"/>
  <line x1="350" y1="376" x2="350" y2="400" stroke="#1f2937" stroke-width="2"/>
  <line x1="135" y1="400" x2="350" y2="400" stroke="#1f2937" stroke-width="2"/>
  <line x1="240" y1="400" x2="240" y2="414" stroke="#1f2937" stroke-width="2"/>
  <polygon points="234,412 246,412 240,422" fill="#1f2937"/>

  <!-- reassess -->
  <rect x="40" y="424" width="400" height="56" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <text x="240" y="447" text-anchor="middle" font-weight="600">Reevaluación precoz y repetida</text>
  <text x="240" y="467" text-anchor="middle">pH, FR, trabajo respiratorio, conciencia</text>

  <!-- failure path -->
  <line x1="440" y1="452" x2="595" y2="452" stroke="#b91c1c" stroke-width="2"/>
  <line x1="595" y1="452" x2="595" y2="174" stroke="#b91c1c" stroke-width="2"/>
  <polygon points="589,176 601,176 595,166" fill="#b91c1c"/>
  <text x="608" y="330" fill="#b91c1c">Fracaso:</text>
  <text x="608" y="348" fill="#b91c1c">intubar</text>
  <text x="608" y="366" fill="#b91c1c">sin demora</text>
  <text x="240" y="512" text-anchor="middle">Mejoría: continuar y vigilar</text>
  <line x1="240" y1="480" x2="240" y2="496" stroke="#15803d" stroke-width="2"/>
</g>
</svg>
