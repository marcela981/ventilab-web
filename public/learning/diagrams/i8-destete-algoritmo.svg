<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="t d">
<title id="t">Algoritmo diario de destete</title>
<desc id="d">Diagrama de flujo. Cada día se hace un cribado de preparación: causa, oxigenación, hemodinamia, estado neurológico y secreciones. Si no se cumplen los criterios, se continúa el soporte, se trata la causa y se repite al día siguiente. Si se cumplen, se realiza una prueba de despertar reduciendo la sedación. Si el paciente no está despierto y tranquilo, se reanuda la sedación a menor dosis y se repite al día siguiente. Si lo está, se realiza la prueba de ventilación espontánea. Si la tolera, se evalúa la vía aérea y se extuba; si no, se vuelve a un soporte cómodo y se busca la causa del fracaso.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" font-size="14" text-anchor="middle">
  <text x="360" y="30" font-size="18" font-weight="600">Cada día: cribar, despertar, probar</text>
  <rect x="190" y="44" width="300" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="340" y="67" font-weight="600">Cribado diario de preparación</text>
  <text x="340" y="88" font-size="13">causa, O₂, hemodinamia, neurológico, secreciones</text>
  <line x1="340" y1="100" x2="340" y2="122" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <rect x="230" y="124" width="220" height="44" rx="22" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="340" y="151" font-weight="600">¿Cumple criterios?</text>
  <line x1="450" y1="146" x2="508" y2="146" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <text x="478" y="138" font-size="13" fill="#b91c1c">No</text>
  <rect x="510" y="118" width="190" height="58" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="605" y="141" font-size="13">Continúa soporte, trata</text>
  <text x="605" y="160" font-size="13">la causa, repite mañana</text>
  <line x1="340" y1="168" x2="340" y2="196" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <text x="356" y="187" font-size="13" text-anchor="start" fill="#15803d">Sí</text>
  <rect x="190" y="198" width="300" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="340" y="221" font-weight="600">Prueba de despertar</text>
  <text x="340" y="242" font-size="13">suspende o reduce la sedación</text>
  <line x1="340" y1="254" x2="340" y2="276" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <rect x="215" y="278" width="250" height="44" rx="22" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="340" y="305" font-weight="600">¿Despierto y tranquilo?</text>
  <line x1="465" y1="300" x2="508" y2="300" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <text x="486" y="292" font-size="13" fill="#b91c1c">No</text>
  <rect x="510" y="272" width="190" height="58" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="605" y="295" font-size="13">Reanuda sedación a menor</text>
  <text x="605" y="314" font-size="13">dosis, repite mañana</text>
  <line x1="340" y1="322" x2="340" y2="350" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <text x="356" y="341" font-size="13" text-anchor="start" fill="#15803d">Sí</text>
  <rect x="190" y="352" width="300" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="340" y="382" font-weight="600">Prueba de ventilación espontánea</text>
  <line x1="340" y1="402" x2="340" y2="424" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <rect x="250" y="426" width="180" height="44" rx="22" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="340" y="453" font-weight="600">¿La tolera?</text>
  <line x1="430" y1="448" x2="508" y2="448" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <text x="470" y="440" font-size="13" fill="#b91c1c">No</text>
  <rect x="510" y="420" width="190" height="58" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="605" y="443" font-size="13">Soporte cómodo y busca</text>
  <text x="605" y="462" font-size="13">la causa del fracaso</text>
  <line x1="250" y1="448" x2="212" y2="448" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <text x="232" y="440" font-size="13" fill="#15803d">Sí</text>
  <rect x="20" y="420" width="190" height="58" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="115" y="443" font-size="13" font-weight="600">Evalúa la vía aérea</text>
  <text x="115" y="462" font-size="13">y extuba</text>
  <text x="360" y="506" font-size="13">Basado en el enfoque de despertar y respirar combinados (ensayo ABC).</text>
</g>
</svg>
