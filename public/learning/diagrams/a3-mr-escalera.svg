<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 445" width="720" height="445" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Maniobra de reclutamiento escalonada</title>
<desc id="d">Gráfico de presión en la vía aérea frente al tiempo dividido en tres fases sombreadas. En la primera, la PEEP sube por escalones y los ciclos mantienen la misma amplitud de presión. En la segunda, la PEEP baja por escalones y se mide la compliance en cada uno. En la tercera se ventila con la PEEP elegida. Una nota indica que es un esquema didáctico y que las maniobras prolongadas a alta presión están desaconsejadas.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
