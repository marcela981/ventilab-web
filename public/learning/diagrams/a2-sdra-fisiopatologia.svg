<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="t d">
  <title id="t">Fisiopatología y fases del SDRA</title>
  <desc id="d">Esquema en cadena. Una agresión pulmonar directa, como neumonía o aspiración, o indirecta, como sepsis extrapulmonar, trauma o pancreatitis, daña el endotelio capilar y el epitelio alveolar. El resultado es edema rico en proteínas e inactivación del surfactante, que producen tres consecuencias: shunt con hipoxemia que responde poco al aumento de FiO2, pulmón aireado pequeño con baja compliance (baby lung) y aumento del espacio muerto con tendencia a la hipercapnia. Debajo, una línea de tiempo con tres fases que se superponen: exudativa, proliferativa y, en una parte de los pacientes, fibrótica.</desc>
  <rect width="100%" height="100%" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937">
    <rect x="20" y="20" width="210" height="96" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="125" y="44" text-anchor="middle" font-weight="700">Agresión</text>
    <text x="125" y="66" text-anchor="middle">directa: neumonía,</text>
    <text x="125" y="84" text-anchor="middle">aspiración</text>
    <text x="125" y="104" text-anchor="middle">indirecta: sepsis, trauma</text>
    <line x1="230" y1="68" x2="262" y2="68" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="266" y="20" width="200" height="96" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="366" y="50" text-anchor="middle" font-weight="700" fill="#b91c1c">Daño de la barrera</text>
    <text x="366" y="72" text-anchor="middle">endotelio capilar y</text>
    <text x="366" y="92" text-anchor="middle">epitelio alveolar</text>
    <line x1="466" y1="68" x2="498" y2="68" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="502" y="20" width="198" height="96" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="601" y="50" text-anchor="middle" font-weight="700" fill="#1d4ed8">Edema proteico</text>
    <text x="601" y="72" text-anchor="middle">alvéolos inundados,</text>
    <text x="601" y="92" text-anchor="middle">surfactante inactivo</text>
    <path d="M601,116 L601,140 L120,140 L120,160" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="360" y1="140" x2="360" y2="160" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="601" y1="140" x2="601" y2="160" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="20" y="164" width="200" height="110" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <text x="120" y="190" text-anchor="middle" font-weight="700" fill="#b91c1c">Shunt</text>
    <text x="120" y="212" text-anchor="middle">sangre que pasa por</text>
    <text x="120" y="232" text-anchor="middle">alvéolos sin aire:</text>
    <text x="120" y="252" text-anchor="middle">hipoxemia que responde</text>
    <text x="120" y="270" text-anchor="middle">poco a la FiO₂</text>
    <rect x="260" y="164" width="200" height="110" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="360" y="190" text-anchor="middle" font-weight="700" fill="#1d4ed8">Baby lung</text>
    <text x="360" y="212" text-anchor="middle">pulmón aireado pequeño</text>
    <text x="360" y="232" text-anchor="middle">con elasticidad casi</text>
    <text x="360" y="252" text-anchor="middle">normal: compliance</text>
    <text x="360" y="270" text-anchor="middle">del sistema baja</text>
    <rect x="500" y="164" width="200" height="110" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <text x="600" y="190" text-anchor="middle" font-weight="700" fill="#6d28d9">Espacio muerto</text>
    <text x="600" y="212" text-anchor="middle">microtrombosis y</text>
    <text x="600" y="232" text-anchor="middle">sobredistensión:</text>
    <text x="600" y="252" text-anchor="middle">más ventilación inútil,</text>
    <text x="600" y="270" text-anchor="middle">tendencia a hipercapnia</text>
    <text x="360" y="320" text-anchor="middle" font-size="15" font-weight="700">Fases (se superponen; su duración varía entre pacientes)</text>
    <line x1="40" y1="440" x2="690" y2="440" stroke="#9ca3af" stroke-width="2" marker-end="url(#ar)"/>
    <text x="680" y="466" text-anchor="end" font-size="13">Tiempo desde la agresión</text>
    <rect x="40" y="340" width="270" height="80" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="175" y="366" text-anchor="middle" font-weight="700" fill="#b91c1c">Exudativa</text>
    <text x="175" y="388" text-anchor="middle">edema, inflamación,</text>
    <text x="175" y="408" text-anchor="middle">membranas hialinas</text>
    <rect x="260" y="352" width="250" height="68" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2" fill-opacity="0.95"/>
    <text x="385" y="378" text-anchor="middle" font-weight="700" fill="#15803d">Proliferativa</text>
    <text x="385" y="400" text-anchor="middle">reabsorción y reparación</text>
    <rect x="490" y="364" width="200" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="580" y="388" text-anchor="middle" font-weight="700">Fibrótica</text>
    <text x="580" y="408" text-anchor="middle">solo en una parte</text>
  </g>
</svg>
