<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="t d">
<title id="t">Efecto de la CPAP sobre la curva presión-volumen</title>
<desc id="d">Curva presión-volumen estática esquemática con forma sigmoidea. Sin CPAP, el volumen de fin de espiración se sitúa en la parte baja y plana de la curva, donde una misma variación de presión produce poco volumen. Con CPAP, el volumen de fin de espiración sube a la parte más empinada y la misma variación de presión produce más volumen. En la parte alta la curva se aplana de nuevo, zona de sobredistensión.</desc>
