<text x="380" y="450" font-size="13" text-anchor="middle" fill="#1f2937">Esquema conceptual: la CPAP eleva el volumen de fin de espiración (CRF)</text>
<text x="380" y="468" font-size="13" text-anchor="middle" fill="#1f2937">y desplaza la respiración a la zona de mayor compliance.</text>
