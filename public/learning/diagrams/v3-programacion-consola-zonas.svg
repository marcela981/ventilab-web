<text x="36" y="150" font-size="13" fill="#6d28d9">Digital | Real</text>
<rect x="28" y="164" width="146" height="30" rx="6" fill="#ffffff" stroke="#9ca3af"/>
<text x="36" y="184" font-size="13">Paciente activo</text>
<rect x="28" y="202" width="146" height="28" rx="6" fill="#ffffff" stroke="#9ca3af"/>
<text x="36" y="221" font-size="13">Ajustar</text>
<rect x="28" y="238" width="146" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="36" y="263" font-size="14">Ppico 22 cmH₂O</text>
<rect x="28" y="284" width="146" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="36" y="309" font-size="14">Pmedia 9,8</text>
<rect x="28" y="330" width="146" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="36" y="355" font-size="14">PEEP 5,0</text>
<text x="36" y="394" font-size="13">… 21 tarjetas</text>
<text x="36" y="414" font-size="13">(métricas y</text>
<text x="36" y="432" font-size="13">signos del paciente)</text>
<rect x="198" y="74" width="330" height="410" rx="8" fill="#ffffff" stroke="#9ca3af"/>
<rect x="210" y="86" width="98" height="46" rx="6" fill="#dcfce7" stroke="#15803d"/>
