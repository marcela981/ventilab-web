<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="t d">
<title id="t">Zonas de la consola del simulador</title>
<desc id="d">Esquema de la pestaña Monitoreo en tres columnas. Arriba, la franja de sesión con Tiempo simulado, Velocidad ×1 ×2 ×4, Pausar, Mostrar caso clínico y Finalizar sesión. Columna izquierda Valores: logos, Modo del monitor Digital o Real, Paciente activo y la lista de tarjetas con el botón Ajustar. Columna central: fila de entrada con FiO2, Volumen o PIP o Presión de soporte y PEEP; barra de alarmas; curvas de presión, flujo y volumen con su barra de herramientas. Columna derecha Controles: selector VOL CTRL o PRES CTRL, Más modos, Asesoría IA, bloque de tiempos con el deslizador Insp Esp, frecuencia, Más parámetros y Estado de la mecánica.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937">
<rect x="16" y="16" width="688" height="46" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="28" y="45" font-size="14">Tiempo simulado 00:04:12 · Velocidad ×1 ×2 ×4 · Pausar · Mostrar caso clínico · Finalizar sesión</text>
