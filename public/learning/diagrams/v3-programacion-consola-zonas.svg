<text x="428" y="106" font-size="13">PEEP</text>
<text x="428" y="124" font-size="14" font-weight="700">5 cmH₂O</text>
<rect x="210" y="140" width="306" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
<text x="220" y="160" font-size="13">Barra de alarmas · Silenciar · Historial · Límites</text>
