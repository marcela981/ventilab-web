<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Balance carga y capacidad</title>
<desc id="d">Balanza con el platillo izquierdo, la carga de los músculos respiratorios, más bajo que el derecho, la capacidad. La carga incluye resistencia por broncoespasmo o secreciones, elastancia por edema o distensión abdominal, auto-PEEP y demanda ventilatoria aumentada por fiebre, acidosis, espacio muerto o sepsis. La capacidad incluye impulso respiratorio central, nervio frénico y placa motora, fuerza y resistencia del diafragma, y electrolitos y nutrición. El texto inferior indica que si la carga supera la capacidad la prueba fracasa y que el análisis se completa con corazón, cerebro y factores endocrino-metabólicos.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<text x="360" y="30" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">El destete como balance entre carga y capacidad</text><polygon points="360,300 330,350 390,350" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><line x1="150" y1="318" x2="570" y2="282" stroke="#1f2937" stroke-width="4"/><line x1="150" y1="318" x2="150" y2="330" stroke="#1f2937" stroke-width="1.5"/><line x1="570" y1="282" x2="570" y2="270" stroke="#1f2937" stroke-width="1.5"/><rect x="20" y="145" width="320" height="160" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="180" y="170" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="600">CARGA</text><text x="32" y="195" font-size="14" fill="#1f2937" text-anchor="start">Resistencia: broncoespasmo, secreciones</text><text x="32" y="214" font-size="14" fill="#1f2937" text-anchor="start">Elastancia: edema, distensión abdominal</text><text x="32" y="233" font-size="14" fill="#1f2937" text-anchor="start">Auto-PEEP: carga umbral</text><text x="32" y="252" font-size="14" fill="#1f2937" text-anchor="start">Demanda: fiebre, acidosis, espacio</text><text x="32" y="271" font-size="14" fill="#1f2937" text-anchor="start">muerto, sepsis</text><rect x="380" y="60" width="320" height="160" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="540" y="85" font-size="15" fill="#15803d" text-anchor="middle" font-weight="600">CAPACIDAD</text><text x="395" y="110" font-size="14" fill="#1f2937" text-anchor="start">Impulso respiratorio central</text><text x="395" y="129" font-size="14" fill="#1f2937" text-anchor="start">Nervio frénico y placa motora</text><text x="395" y="148" font-size="14" fill="#1f2937" text-anchor="start">Fuerza y resistencia del diafragma</text><text x="395" y="167" font-size="14" fill="#1f2937" text-anchor="start">Fósforo, potasio, magnesio,</text><text x="395" y="186" font-size="14" fill="#1f2937" text-anchor="start">nutrición</text><line x1="150" y1="305" x2="150" y2="318" stroke="#1f2937" stroke-width="1.5"/><line x1="570" y1="220" x2="570" y2="282" stroke="#1f2937" stroke-width="1.5"/><text x="360" y="385" font-size="14" fill="#1f2937" text-anchor="middle">Si la carga supera la capacidad, la prueba fracasa.</text><text x="360" y="404" font-size="14" fill="#1f2937" text-anchor="middle">Completa el análisis con el corazón (C), el cerebro (B)</text><text x="360" y="423" font-size="14" fill="#1f2937" text-anchor="middle">y los factores endocrino-metabólicos (E).</text>
</svg>
