<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Aireación y perfusión en supino y prono</title>
<desc id="d">Dos cortes transversales esquemáticos del pulmón. En supino, la parte ventral superior está aireada, la intermedia poco aireada y la dorsal inferior colapsada, y los puntos morados de perfusión se concentran en la región dorsal colapsada. En prono, la región dorsal, ahora arriba, está aireada, solo una franja ventral inferior está colapsada y la perfusión sigue concentrada en la región dorsal, ahora ventilada. Una flecha central indica la dirección de la gravedad.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<defs><clipPath id="cs"><ellipse cx="190" cy="215" rx="140" ry="95"/></clipPath><clipPath id="cp"><ellipse cx="530" cy="215" rx="140" ry="95"/></clipPath><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><text x="360" y="34" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Aireación y perfusión en supino y en prono (corte transversal)</text><text x="190" y="70" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700">SUPINO</text><text x="530" y="70" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700">PRONO</text><g clip-path="url(#cs)"><rect x="40" y="110" width="300" height="70" fill="#dbeafe"/><rect x="40" y="180" width="300" height="50" fill="#f3f4f6"/><rect x="40" y="230" width="300" height="90" fill="#fee2e2"/></g><ellipse cx="190" cy="215" rx="140" ry="95" fill="none" stroke="#1f2937" stroke-width="2"/><g clip-path="url(#cp)"><rect x="380" y="110" width="300" height="120" fill="#dbeafe"/><rect x="380" y="230" width="300" height="50" fill="#f3f4f6"/><rect x="380" y="280" width="300" height="40" fill="#fee2e2"/></g><ellipse cx="530" cy="215" rx="140" ry="95" fill="none" stroke="#1f2937" stroke-width="2"/><circle cx="102" cy="290" r="4.5" fill="#6d28d9"/><circle cx="124" cy="290" r="4.5" fill="#6d28d9"/><circle cx="146" cy="290" r="4.5" fill="#6d28d9"/><circle cx="168" cy="290" r="4.5" fill="#6d28d9"/><circle cx="190" cy="290" r="4.5" fill="#6d28d9"/><circle cx="212" cy="290" r="4.5" fill="#6d28d9"/><circle cx="234" cy="290" r="4.5" fill="#6d28d9"/><circle cx="256" cy="290" r="4.5" fill="#6d28d9"/><circle cx="278" cy="290" r="4.5" fill="#6d28d9"/><circle cx="113" cy="272" r="4.5" fill="#6d28d9"/><circle cx="135" cy="272" r="4.5" fill="#6d28d9"/><circle cx="157" cy="272" r="4.5" fill="#6d28d9"/><circle cx="179" cy="272" r="4.5" fill="#6d28d9"/><circle cx="201" cy="272" r="4.5" fill="#6d28d9"