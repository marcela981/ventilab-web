<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="t d">
<title id="t">Curvas escalares en ventilación controlada por presión</title>
<desc id="d">Tres gráficas apiladas de presión, flujo y volumen frente al tiempo durante dos ciclos de PCV. La presión tiene forma cuadrada: sube rápidamente hasta el nivel programado, se mantiene durante el tiempo inspiratorio y vuelve a la PEEP. El flujo inspiratorio alcanza un pico al inicio y desacelera de forma exponencial hasta casi cero. El volumen sube rápido al principio y luego más lento; su valor final no lo fija el operador.</desc>
