<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Maniobra de oclusión espiratoria</title>
<desc id="d">Curva de presión en la vía aérea frente al tiempo con PEEP de 8 cmH2O. Tras un ciclo asistido, el operador ocluye la vía aérea al final de la espiración. Durante la oclusión, el esfuerzo del paciente hace caer la presión: la caída en los primeros 100 milisegundos es la P0.1 y la caída máxima respecto de la PEEP es la presión de oclusión, en este ejemplo de menos 20 cmH2O. Al abrirse las válvulas la presión vuelve a la PEEP.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><text x="360" y="30" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Oclusión al final de la espiración: P0.1 y ΔPocc</text><rect x="390" y="55" width="130.5" height="260" rx="0" fill="#f3f4f6" stroke="none" stroke-width="1.5"/><text x="455.3" y="72" font-size="13" fill="#1f2937" text-anchor="middle">válvulas cerradas</text><line x1="100" y1="55" x2="100" y2="315" stroke="#9ca3af" stroke-width="1.5"/><line x1="100" y1="200" x2="680" y2="200" stroke="#9ca3af" stroke-width="1.5"/><line x1="100" y1="144" x2="680" y2="144" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/><text x="676" y="138" font-size="13" fill="#9ca3af" text-anchor="end">PEEP 8</text><text x="92" y="274" font-size="13" fill="#1f2937" text-anchor="end">−10</text><text x="92" y="204" font-size="13" fill="#1f2937" text-anchor="end">0</text><text x="92" y="134" font-size="13" fill="#1f2937" text-anchor="end">10</text><text x="92" y="64" font-size="13" fill="#1f2937" text-anchor="end">20</text><text x="45" y="185" font-size="13" fill="#1f2937" text-anchor="middle" transform="rotate(-90 45 185)">Paw (cmH₂O)</text><line x1="100" y1="315" x2="100" y2="321" stroke="#9ca3af" stroke-width="1.5"/><text x="100" y="337" font-size="13" fill="#1f2937" text-anchor="middle">0</text><line x1="245" y1="315" x2="245" y2="321" stroke="#9ca3af" stroke-width="1.5"/><text x="245" y="337" font-size="13" fill="#1f2937" text-anchor="middle">1</text><line x1="390" y1="315" x2="390" y2="321" stroke="#9ca3af" stroke-width="1.5"/><text x="390" y="337" font-size="13" fill="#1f2937" text-anchor="middle">2</text><line x1="535" y1="315" x2="535" y2="321" stroke="#9ca3af" stroke-width="1.5"/><text x="535" y="337" font-size="13" fill="#1f2937" text-anchor="middle">3</text><line x1="680" y1="315" x2="680" y2="321" stroke="#9ca3af" stroke-width="1.5"/><text x="680" y="337" font-size="13" fill="#1f2937" text-anchor="middle">4</text><text x="390" y="357" font-size="13" fill="#1f2937" text-anchor="middle">Tiempo (s)</text><polyline points="100,144 143.5,144 152.2,151 165.3,74 274,74 288.5,144 390,144 404.5,165 462.5,284 506,172 520.5,144 578.5,144 587.2,151 600.3,74 680,74" fill="none" stroke="#1d4ed8" stroke-width="2.8" stroke-linejoin="round"/><line x1="407.4" y1="144" x2="407.4" y2="165" stroke="#c2410c" stroke-width="2"/><text x="384" y="166" font-size="14" fill="#c2410c" text-anchor="end" font-weight="600">P0.1</text><text x="384" y="184" font-size="13" fill="#c2410c" text-anchor="end">caída en 100 ms</text><line x1="479.9" y1="144" x2="479.9" y2="284" stroke="#b91c1c" stroke-width="2" marker-end="url(#ahr)"/><text x="488.6" y="242" font-size="14" fill="#b91c1c" text-anchor="start" font-weight="600">ΔPocc = −20</text><text x="216" y="59.5" font-size="13" fill="#1d4ed8" text-anchor="middle">ciclo asistido</text><text x="360" y="385" font-size="13" fill="#1f2937" text-anchor="middle">Ejemplo ilustrativo: ΔPocc de −20 cmH₂O equivale a un Pmus estimado de unos 15 cmH₂O</text>
</svg>
