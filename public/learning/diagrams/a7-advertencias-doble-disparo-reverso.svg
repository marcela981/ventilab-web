/text><text x="400" y="395" font-size="13" fill="#1f2937" text-anchor="middle" transform="rotate(-90 400 395)">Pmus (cmH₂O)</text><text x="434" y="169" font-size="13" fill="#1f2937" text-anchor="end">8</text><text x="434" y="84" font-size="13" fill="#1f2937" text-anchor="end">30</text><text x="434" y="279" font-size="13" fill="#1f2937" text-anchor="end">0</text><text x="434" y="369" font-size="13" fill="#1f2937" text-anchor="end">0</text><text x="434" y="427.3" font-size="13" fill="#1f2937" text-anchor="end">−10</text><line x1="440" y1="455" x2="690" y2="455" stroke="#9ca3af" stroke-width="1.5"/><line x1="440" y1="455" x2="440" y2="461" stroke="#9ca3af" stroke-width="1.5"/><text x="440" y="477" font-size="13" fill="#1f2937" text-anchor="middle">0</text><line x1="523.3" y1="455" x2="523.3" y2="461" stroke="#9ca3af" stroke-width="1.5"/><text x="523.3" y="477" font-size="13" fill="#1f2937" text-anchor="middle">1</text><line x1="606.7" y1="455" x2="606.7" y2="461" stroke="#9ca3af" stroke-width="1.5"/><text x="606.7" y="477" font-size="13" fill="#1f2937" text-anchor="middle">2</text><line x1="690" y1="455" x2="690" y2="461" stroke="#9ca3af" stroke-width="1.5"/><text x="690" y="477" font-size="13" fill="#1f2937" text-anchor="middle">3</text><text x="565" y="497" font-size="13" fill="#1f2937" text-anchor="middle">Tiempo (s)</text><polyline points="440,165 456.7,165 519.2,110.9 525.8,165 540,176.6 573.3,165 690,165" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/><polyline points="440,275 456.7,275 456.7,233.3 519.2,233.3 519.2,325 522.5,317.6 525.8,311.3 529.2,305.9 544.2,272.5 565,295.8 565,295.8 568.3,294.1 571.7,292.4 575,291 578.3,289.6 581.7,288.4 585,287.2 588.3,286.2 591.7,285.2 595,284.4 598.3,283.6 601.7,282.8 605,282.2 608.3,281.6 611.7,281 615,280.5 618.3,280 621.7,279.6 625,279.2 628.3,278.8 631.7,278.5 635,278.2 638.3,277.9 641.7,277.7 645,277.5 648.3,277.3 651.7,277.1 655,276.9 658.3,276.7 661.7,276.6 665,276.4 668.3,276.3 671.7,276.2 675,276.1 678.3,276 681.7,275.9 685,275.8 688.3,275.8" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round"/><polyline points="440,365 490,365 535.8,411.7 573.3,365 690,365" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-linejoin="round"/><text x="219.2" y="92" font-size="13" fill="#1d4ed8" text-anchor="middle">2.º ciclo apilado</text><text x="106.7" y="190" font-size="13" fill="#1d4ed8" text-anchor="start">caída: disparo</text><text x="256.7" y="420" font-size="13" fill="#6d28d9" text-anchor="middle">esfuerzo más largo</text><text x="256.7" y="436" font-size="13" fill="#6d28d9" text-anchor="middle">que el Ti del ventilador</text><text x="565" y="110" font-size="13" fill="#1d4ed8" text-anchor="start">sin caída previa:</text><text x="565" y="126" font-size="13" fill="#1d4ed8" text-anchor="start">dispara la máquina</text><text x="560.8" y="255" font-size="13" fill="#15803d" text-anchor="start">flujo espiratorio</text><text x="560.8" y="240" font-size="13" fill="#15803d" text-anchor="start">se interrumpe</text><text x="623.3" y="420" font-size="13" fill="#6d28d9" text-anchor="middle">esfuerzo provocado</text><text x="623.3" y="436" font-size="13" fill="#6d28d9" text-anchor="middle">por la insuflación</text><text x="360" y="525" font-size="13" fill="#1f2937" text-anchor="middle">Paw: presión en la vía aérea · Pmus: presión generada por los músculos del paciente</text>
