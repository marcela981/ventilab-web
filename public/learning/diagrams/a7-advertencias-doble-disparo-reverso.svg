<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Doble disparo frente a disparo reverso</title>
<desc id="d">Dos paneles con curvas de presión en la vía aérea, flujo y presión muscular del paciente frente al tiempo en ventilación controlada por volumen. En el panel A el paciente inicia el ciclo con una caída de presión y su esfuerzo dura más que el tiempo inspiratorio del ventilador, de modo que dispara un segundo ciclo casi sin espiración y la presión del segundo ciclo es mayor por el volumen apilado. En el panel B el ventilador inicia el ciclo sin caída previa de presión; la insuflación provoca un esfuerzo muscular tardío que deforma la presión e interrumpe el flujo espiratorio.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<text x="360" y="30" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Doble disparo frente a disparo reverso (VCV)</text><text x="215" y="60" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">A. Doble disparo por el paciente</text><line x1="90" y1="75" x2="90" y2="172" stroke="#9ca3af" stroke-width="1.5"/><line x1="90" y1="165" x2="340" y2="165" stroke="#9ca3af" stroke-width="1.5"/><line x1="90" y1="215" x2="90" y2="335" stroke="#9ca3af" stroke-width="1.5"/><line x1="90" y1="275" x2="340" y2="275" stroke="#9ca3af" stroke-width="1.5"/><line x1="90" y1="350" x2="90" y2="440" stroke="#9ca3af" stroke-width="1.5"/><line x1="90" y1="365" x2="340" y2="365" stroke="#9ca3af" stroke-width="1.5"/><text x="50" y="125" font-size="13" fill="#1f2937" text-anchor="middle" transform="rotate(-90 50 125)">Paw (cmH₂O)</text><text x="50" y="275" font-size="13" fill="#1f2937" text-anchor="middle" transform="rotate(-90 50 275)">Flujo (L/min)</text><text x="50" y="395" font-size="13" fill="#1f2937" text-anchor="middle" transform="rotate(-90 50 395)">Pmus (cmH₂O)</text><text x="84" y="169" font-size="13" fill="#1f2937" text-anchor="end">8</text><text x="84" y="84" font-size="13" fill="#1f2937" text-anchor="end">30</text><text x="84" y="279" font-size="13" fill="#1f2937" text-anchor="end">0</text><text x="84" y="369" font-size="13" fill="#1f2937" text-anchor="end">0</text><text x="84" y="427.3" font-size="13" fill="#1f2937" text-anchor="end">−10</text><line x1="90" y1="455" x2="340" y2="455" stroke="#9ca3af" stroke-width="1.5"/><line x1="90" y1="455" x2="90" y2="461" stroke="#9ca3af" stroke-width="1.5"/><text x="90" y="477" font-size="13" fill="#1f2937" text-anchor="middle">0</text><line x1="173.3" y1="455" x2="173.3" y2="461" stroke="#9ca3af" stroke-width="1.5"/><text x="173.3" y="477" font-size="13" fill="#1f2937" text-anchor="middle">1</text><line x1="256.7" y1="455" x2="256.7" y2="461" stroke="#9ca3af" stroke-width="1.5"/><text x="256.7" y="477" fon