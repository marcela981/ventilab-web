<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Ciclo de un intento de evaluación</title>
<desc id="d">Diagrama de flujo del intento: la evaluación asignada aparece en Próximas, pasa a Activas cuando abre la ventana; el estudiante pulsa Comenzar y el intento queda En curso con guardado automático; al enviar, o al agotarse el tiempo, el intento queda Enviado. Las preguntas cerradas se califican solas; si hay preguntas abiertas queda Pendiente de calificación hasta que el docente califica. Finalmente queda Calificado y la nota se ve solo cuando está publicada, de forma automática en quizzes y talleres, o cuando el docente la publica en exámenes.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker></defs>
<rect x="20" y="30" width="130" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="50" y="63" font-size="15" font-weight="700">Próximas</text>
<rect x="190" y="30" width="130" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="227" y="63" font-size="15" font-weight="700">Activas</text>
<rect x="360" y="30" width="150" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="378" y="56" font-size="15" font-weight="700">En curso</text>
<text x="378" y="76" font-size="13">guardado automático</text>
<rect x="550" y="30" width="150" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="590" y="63" font-size="15" font-weight="700">Enviado</text>
<line x1="150" y1="58" x2="188" y2="58" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<line x1="320" y1="58" x2="358" y2="58" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<line x1="510" y1="58" x2="548" y2="58" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="150" y="110" font-size="13">abre la ventana</text>
<text x="322" y="110" font-size="13">Comenzar</text>
<text x="490" y="110" font-size="13">Enviar o fin del tiempo</text>
<line x1="625" y1="86" x2="625" y2="160" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="470" y="162" width="230" height="70" rx="8" fill="#fee2e2" stroke="#c2410c"/>
<text x="486" y="190" font-size="15" font-weight="700">Pendiente de calificación</text>
<text x="486" y="214" font-size="13">hay preguntas abiertas o prácticas</text>
<rect x="190" y="162" width="230" height="70" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="206" y="190" font-size="15" font-weight="700">Calificado</text>
<text x="206" y="214" font-size="13">todas las preguntas tienen nota</text>
<line x1="468" y1="197" x2="422" y2="197" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="430" y="252" font-size="13">el docente califica</text>
<path d="M600 86 C 560 130 380 120 330 160" stroke="#15803d" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="360" y="140" font-size="13" fill="#15803d">solo preguntas cerradas</text>
<line x1="305" y1="232" x2="305" y2="290" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="100" y="292" width="410" height="108" rx="8" fill="#f3f4f6" stroke="#6d28d9"/>
<text x="116" y="320" font-size="15" font-weight="700">Nota publicada (visible para ti)</text>
<text x="116" y="346" font-size="14">Quiz y Taller: se publica al cerrar el intento.</text>
<text x="116" y="370" font-size="14">Examen: cuando el docente pulsa «Publicar»,</text>
<text x="116" y="390" font-size="14">salvo que haya activado la publicación inmediata.</text>
<rect x="530" y="292" width="170" height="108" rx="8" fill="#ffffff" stroke="#9ca3af"/>
<text x="544" y="320" font-size="14" font-weight="700">Escala 0,0 a 5,0</text>
<text x="544" y="346" font-size="13">nota aprobatoria</text>
<text x="544" y="366" font-size="13">configurable</text>
<text x="544" y="386" font-size="13">(3,0 por defecto)</text>
</g>
</svg>
