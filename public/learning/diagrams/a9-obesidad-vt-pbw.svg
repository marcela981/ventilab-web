<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">Volumen corriente calculado con peso real frente a peso corporal predicho</title>
<desc id="d">Gráfico de barras para un hombre de 170 cm y 130 kg. Con 6 mL/kg de peso real el volumen corriente sería de 780 mL; con 6 mL/kg de peso corporal predicho (66 kg) es de unos 396 mL. La barra del peso real casi duplica la del peso predicho, aunque el tamaño de los pulmones depende de la talla y el sexo, no del peso.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<line x1="110" y1="320" x2="660" y2="320" stroke="#9ca3af" stroke-width="2"/>
<line x1="110" y1="320" x2="110" y2="60" stroke="#9ca3af" stroke-width="2"/>
<line x1="104" y1="320" x2="660" y2="320" stroke="#f3f4f6" stroke-width="1"/>
<text x="100" y="325" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1f2937" text-anchor="end">0</text>
<line x1="104" y1="260" x2="660" y2="260" stroke="#f3f4f6" stroke-width="1"/>
<text x="100" y="265" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1f2937" text-anchor="end">200</text>
<line x1="104" y1="200" x2="660" y2="200" stroke="#f3f4f6" stroke-width="1"/>
<text x="100" y="205" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1f2937" text-anchor="end">400</text>
<line x1="104" y1="140" x2="660" y2="140" stroke="#f3f4f6" stroke-width="1"/>
<text x="100" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1f2937" text-anchor="end">600</text>
<line x1="104" y1="80" x2="660" y2="80" stroke="#f3f4f6" stroke-width="1"/>
<text x="100" y="85" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1f2937" text-anchor="end">800</text>
<text x="40" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 40 190)">Volumen corriente (mL)</text>
<rect x="190" y="86" width="150" height="234" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="265" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#b91c1c" text-anchor="middle" font-weight="bold">780 mL</text>
<text x="265" y="344" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">6 mL/kg × 130 kg</text>
<text x="265" y="364" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">(peso real: error)</text>
<rect x="430" y="201.2" width="150" height="118.8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="505" y="191.2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#15803d" text-anchor="middle" font-weight="bold">396 mL</text>
<text x="505" y="344" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">6 mL/kg × 66 kg</text>
<text x="505" y="364" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">(peso predicho)</text>
<text x="380" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Hombre, 170 cm, 130 kg: PBW = 50 + 0,91 × (170 − 152,4) ≈ 66 kg</text>
</svg>
