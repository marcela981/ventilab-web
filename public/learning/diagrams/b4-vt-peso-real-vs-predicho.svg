<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Volumen corriente con peso real frente a peso predicho</title>
<desc id="d">Gráfico de barras horizontales para una mujer de 160 cm y 110 kg. Con 6 mL/kg de peso real recibiría 660 mL, equivalente a unos 12,6 mL/kg de peso predicho. Con 8 mL/kg de peso predicho recibiría 419 mL y con 6 mL/kg de peso predicho 314 mL.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<text x="360" y="32" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Mujer de 160 cm y 110 kg: ¿qué volumen corriente recibe?</text><text x="360" y="56" font-size="14" fill="#1f2937" text-anchor="middle">PBW = 45,5 + 0,91 × (160 − 152,4) ≈ 52,4 kg</text><line x1="250" y1="80" x2="250" y2="262" stroke="#9ca3af" stroke-width="1"/><text x="250" y="282" font-size="13" fill="#1f2937" text-anchor="middle">0</text><line x1="305.7" y1="80" x2="305.7" y2="262" stroke="#9ca3af" stroke-width="1"/><text x="305.7" y="282" font-size="13" fill="#1f2937" text-anchor="middle">100</text><line x1="361.4" y1="80" x2="361.4" y2="262" stroke="#9ca3af" stroke-width="1"/><text x="361.4" y="282" font-size="13" fill="#1f2937" text-anchor="middle">200</text><line x1="417.1" y1="80" x2="417.1" y2="262" stroke="#9ca3af" stroke-width="1"/><text x="417.1" y="282" font-size="13" fill="#1f2937" text-anchor="middle">300</text><line x1="472.9" y1="80" x2="472.9" y2="262" stroke="#9ca3af" stroke-width="1"/><text x="472.9" y="282" font-size="13" fill="#1f2937" text-anchor="middle">400</text><line x1="528.6" y1="80" x2="528.6" y2="262" stroke="#9ca3af" stroke-width="1"/><text x="528.6" y="282" font-size="13" fill="#1f2937" text-anchor="middle">500</text><line x1="584.3" y1="80" x2="584.3" y2="262" stroke="#9ca3af" stroke-width="1"/><text x="584.3" y="282" font-size="13" fill="#1f2937" text-anchor="middle">600</text><line x1="640" y1="80" x2="640" y2="262" stroke="#9ca3af" stroke-width="1"/><text x="640" y="282" font-size="13" fill="#1f2937" text-anchor="middle">700</text><text x="445" y="310" font-size="14" fill="#1f2937" text-anchor="middle">Volumen corriente (mL)</text><text x="238" y="117" font-size="14" fill="#1f2937" text-anchor="end">6 mL/kg de peso REAL</text><rect x="250" y="92" width="367.7" height="38" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="609.7" y="117" font-size="14" fill="#b91c1c" text-anchor="end" font-weight="600">660 mL ≈ 12,6 mL/kg PBW</text><text x="238" y="175" font-size="14" fill="#1f2937" text-anchor="end">8 mL/kg de PBW</text><rect x="250" y="150" width="233.4" height="38" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="475.4" y="175" font-size="14" fill="#c2410c" text-anchor="end" font-weight="600">419 mL</text><text x="238" y="233" font-size="14" fill="#1f2937" text-anchor="end">6 mL/kg de PBW</text><rect x="250" y="208" width="174.9" height="38" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="416.9" y="233" font-size="14" fill="#15803d" text-anchor="end" font-weight="600">314 mL</text><line x1="250" y1="80" x2="250" y2="262" stroke="#1f2937" stroke-width="1.5"/>
</svg>
