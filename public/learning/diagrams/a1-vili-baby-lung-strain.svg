<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t d">
  <title id="t">Mismo volumen corriente, distinto strain</title>
  <desc id="d">Comparación de dos columnas. A la izquierda, un pulmón sano con 2100 mL de pulmón aireado al final de la espiración recibe un volumen corriente de 420 mL: el strain es 0,20. A la derecha, un pulmón con SDRA en el que solo quedan 700 mL aireados (el baby lung) porque el resto está colapsado o lleno de edema; el mismo volumen corriente de 420 mL produce un strain de 0,60, tres veces mayor. Valores ilustrativos.</desc>
  <rect width="100%" height="100%" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="360" y="34" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Strain = volumen corriente / volumen aireado al final de la espiración</text>
    <line x1="70" y1="380" x2="660" y2="380" stroke="#9ca3af" stroke-width="2"/>
    <rect x="150" y="128" width="140" height="252" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="150" y="78" width="140" height="50" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="220" y="108" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Vt 420 mL</text>
    <text x="220" y="250" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">Aireado</text>
    <text x="220" y="270" font-size="14" fill="#1d4ed8" text-anchor="middle">2100 mL</text>
    <rect x="430" y="128" width="140" height="168" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="500" y="200" font-size="14" fill="#1f2937" text-anchor="middle">Colapsado</text>
    <text x="500" y="218" font-size="14" fill="#1f2937" text-anchor="middle">o con edema</text>
    <text x="500" y="236" font-size="14" fill="#1f2937" text-anchor="middle">(no recibe aire)</text>
    <rect x="430" y="296" width="140" height="84" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="500" y="332" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">Baby lung</text>
    <text x="500" y="352" font-size="14" fill="#1d4ed8" text-anchor="middle">700 mL</text>
    <rect x="430" y="246" width="140" height="50" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="500" y="276" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Vt 420 mL</text>
    <text x="220" y="404" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Pulmón sano</text>
    <text x="220" y="426" font-size="15" fill="#15803d" text-anchor="middle">strain = 420 / 2100 = 0,20</text>
    <text x="500" y="404" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Pulmón con SDRA</text>
    <text x="500" y="426" font-size="15" fill="#b91c1c" text-anchor="middle">strain = 420 / 700 = 0,60</text>
    <text x="360" y="456" font-size="14" fill="#1f2937" text-anchor="middle">Valores ilustrativos para el cálculo, no umbrales clínicos.</text>
  </g>
</svg>
