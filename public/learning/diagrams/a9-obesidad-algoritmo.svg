<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="t d">
<title id="t">Secuencia de protección pulmonar en el paciente con obesidad</title>
<desc id="d">Diagrama de flujo vertical con seis pasos: 1, posición con tronco elevado o Trendelenburg invertido; 2, preoxigenación con presión positiva; 3, intubación con plan de vía aérea difícil; 4, volumen corriente de 6 mL/kg de peso predicho; 5, PEEP individualizada según mecánica o presión esofágica, vigilando driving pressure y hemodinamia; 6, extubación semisentado con VNI o CPAP preventiva en pacientes de alto riesgo. A la derecha, un recuadro recuerda que las maniobras de reclutamiento son selectivas y requieren vigilancia hemodinámica.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="40" y="24" width="420" height="64" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="56" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1d4ed8" font-weight="bold">1. Posición</text>
<text x="56" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937">Tronco elevado o Trendelenburg invertido</text>
<line x1="250" y1="88" x2="250" y2="108" stroke="#1f2937" stroke-width="2" marker-end="url(#a2)"/>
<rect x="40" y="110" width="420" height="64" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="56" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1d4ed8" font-weight="bold">2. Preoxigenación</text>
<text x="56" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937">Con presión positiva (VNI o CPAP)</text>
<line x1="250" y1="174" x2="250" y2="194" stroke="#1f2937" stroke-width="2" marker-end="url(#a2)"/>
<rect x="40" y="196" width="420" height="64" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="56" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#1d4ed8" font-weight="bold">3. Intubación</text>
<text x="56" y="246" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937">Plan de vía aérea difícil, operador entrenado</text>
<line x1="250" y1="260" x2="250" y2="280" stroke="#1f2937" stroke-width="2" marker-end="url(#a2)"/>
<rect x="40" y="282" width="420" height="64" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="56" y="308" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#15803d" font-weight="bold">4. Volumen corriente</text>
<text x="56" y="332" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937">6 mL/kg de peso predicho (talla y sexo)</text>
<line x1="250" y1="346" x2="250" y2="366" stroke="#1f2937" stroke-width="2" marker-end="url(#a2)"/>
<rect x="40" y="368" width="420" height="64" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="56" y="394" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#15803d" font-weight="bold">5. PEEP individualizada</text>
<text x="56" y="418" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937">Mecánica o Pes; vigila ΔP y hemodinamia</text>
<line x1="250" y1="432" x2="250" y2="452" stroke="#1f2937" stroke-width="2" marker-end="url(#a2)"/>
<rect x="40" y="454" width="420" height="64" rx="10" fill="#f3f4f6" stroke="#6d28d9" stroke-width="2"/>
<text x="56" y="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#6d28d9" font-weight="bold">6. Extubación</text>
<text x="56" y="504" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937">Semisentado; VNI/CPAP preventiva si alto riesgo</text>
<rect x="490" y="300" width="200" height="150" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="590" y="326" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="bold">Reclutamiento</text>
<text x="590" y="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">Solo seleccionado,</text>
<text x="590" y="374" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">controlado por el</text>
<text x="590" y="396" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">ventilador y con</text>
<text x="590" y="418" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">vigilancia de PAM</text>
<line x1="490" y1="370" x2="462" y2="370" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="490" y="110" width="200" height="120" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
<text x="590" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">Monitoriza</text>
<text x="590" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">SpO₂, Pplat, ΔP,</text>
<text x="590" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">PAM, gasometría</text>
<text x="590" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">y Ptp si hay Pes</text>
</svg>
