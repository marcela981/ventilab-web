<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="t d">
  <title id="t">Relación entre PaCO2 y ventilación alveolar</title>
  <desc id="d">Gráfica de PaCO2 en mmHg frente a ventilación alveolar en litros por minuto, de 2 a 8, calculada con la ecuación de la ventilación alveolar para una producción de CO2 supuesta de 200 mL por minuto. La curva es una hipérbola: a ventilación baja, aumentar medio litro por minuto reduce la PaCO2 unos 11 mmHg; a ventilación alta, el mismo aumento la reduce menos de 2 mmHg. Una banda sombreada marca el rango normal de 35 a 45 mmHg.</desc>
  <rect width="100%" height="100%" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937">
    <text x="375" y="34" font-size="18" font-weight="bold" text-anchor="middle">PaCO₂ frente a ventilación alveolar (V̇CO₂ supuesta: 200 mL/min)</text>

    <!-- normal band -->
    <rect x="90" y="266" width="570" height="32" fill="#dcfce7"/>
    <text x="655" y="287" font-size="14" text-anchor="end" fill="#15803d">rango normal 35–45 mmHg</text>

    <!-- grid -->
    <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 4">
      <line x1="90" y1="346" x2="660" y2="346"/>
      <line x1="90" y1="282" x2="660" y2="282"/>
      <line x1="90" y1="218" x2="660" y2="218"/>
      <line x1="90" y1="154" x2="660" y2="154"/>
      <line x1="90" y1="90" x2="660" y2="90"/>
    </g>
    <!-- axes -->
    <g stroke="#9ca3af" stroke-width="2">
      <line x1="90" y1="410" x2="660" y2="410"/>
      <line x1="90" y1="410" x2="90" y2="80"/>
    </g>
    <g font-size="13" text-anchor="end">
      <text x="82" y="414">0</text>
      <text x="82" y="350">20</text>
      <text x="82" y="286">40</text>
      <text x="82" y="222">60</text>
      <text x="82" y="158">80</text>
      <text x="82" y="94">100</text>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="90" y="430">2</text>
      <text x="185" y="430">3</text>
      <text x="280" y="430">4</text>
      <text x="375" y="430">5</text>
      <text x="470" y="430">6</text>
      <text x="565" y="430">7</text>
      <text x="660" y="430">8</text>
    </g>
    <text x="375" y="458" font-size="14" text-anchor="middle">Ventilación alveolar (L/min)</text>
    <text x="30" y="250" font-size="14" text-anchor="middle" transform="rotate(-90 30 250)">PaCO₂ (mmHg)</text>

    <!-- hyperbola -->
    <polyline fill="none" stroke="#1d4ed8" stroke-width="3"
      points="90,133.8 113.8,164.6 137.5,189.2 161.3,209.3 185,226 208.8,240.2 232.5,252.2 256.3,262.7 280,271.8 327.5,287.1 375,299.6 422.5,309.8 470,317.8 517.5,325 565,331 612.5,336.2 660,340.9"/>
    <text x="300" y="250" font-size="15" fill="#1d4ed8">PaCO₂ = V̇CO₂ · 0,863 / V̇A</text>

    <!-- segment A -->
    <circle cx="137.5" cy="189.2" r="5" fill="#b91c1c"/>
    <circle cx="185" cy="226" r="5" fill="#b91c1c"/>
    <text x="150" y="150" font-size="14" fill="#b91c1c">+0,5 L/min: ≈ −11 mmHg</text>

    <!-- segment B -->
    <circle cx="517.5" cy="325" r="5" fill="#c2410c"/>
    <circle cx="565" cy="331" r="5" fill="#c2410c"/>
    <text x="470" y="372" font-size="14" fill="#c2410c">+0,5 L/min: ≈ −2 mmHg</text>
  </g>
</svg>
