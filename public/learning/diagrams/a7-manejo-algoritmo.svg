<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Algoritmo de manejo de asincronías</title>
<desc id="d">Diagrama de flujo vertical. Paso 0: si el paciente está inestable se ventila con bolsa y se descartan causas de deterioro agudo. Paso 1: detectar observando curvas y paciente. Paso 2: clasificar por fase del ciclo. Paso 3 se divide en dos ramas: impulso alto o asistencia insuficiente, e impulso bajo o sobreasistencia, con sus causas. Paso 4: corregir la causa y una variable a la vez. Paso 5: reevaluar con curvas, índice de asincronía, P0.1 y presión de oclusión. Si persiste: optimizar sedoanalgesia, cambiar de modo y, en SDRA grave, valorar bloqueo neuromuscular.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><text x="360" y="30" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Abordaje sistemático de una asincronía</text><rect x="60" y="45" width="600" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="360" y="67" font-size="14" fill="#1f2937" text-anchor="middle">0. ¿Inestable? Desatura, hipotensión o gran agitación:</text><text x="360" y="86" font-size="14" fill="#1f2937" text-anchor="middle">ventila con bolsa y descarta DOPE antes de ajustar</text><line x1="360" y1="95" x2="360" y2="113" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/><rect x="60" y="115" width="600" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="360" y="137" font-size="14" fill="#1f2937" text-anchor="middle">1. Detecta: mira las curvas y al paciente;</text><text x="360" y="156" font-size="14" fill="#1f2937" text-anchor="middle">compara la FR del paciente con la del ventilador</text><line x1="360" y1="165" x2="360" y2="183" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/><rect x="60" y="185" width="600" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="360" y="207" font-size="14" fill="#1f2937" text-anchor="middle">2. Clasifica por fase: disparo · flujo · ciclado ·</text><text x="360" y="226" font-size="14" fill="#1f2937" text-anchor="middle">doble disparo · disparo reverso</text><line x1="250" y1="235" x2="200" y2="258" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/><line x1="470" y1="235" x2="520" y2="258" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/><rect x="40" y="260" width="300" height="92" rx="8" fill="#f3f4f6" stroke="#c2410c" stroke-width="1.5"/><text x="190" y="282" font-size="14" fill="#1f2937" text-anchor="middle">3a. Impulso alto o</text><text x="190" y="301" font-size="14" fill="#1f2937" text-anchor="middle">asistencia insuficiente:</text><text x="190" y="320" font-size="14" fill="#1f2937" text-anchor="middle">dolor, ansiedad, acidosis,</text><text x="190" y="339" font-size="14" fill="#1f2937" text-anchor="middle">fiebre, flujo o Ti cortos</text><rect x="380" y="260" width="300" height="92" rx="8" fill="#f3f4f6" stroke="#6d28d9" stroke-width="1.5"/><text x="530" y="282" font-size="14" fill="#1f2937" text-anchor="middle">3b. Impulso bajo o</text><text x="530" y="301" font-size="14" fill="#1f2937" text-anchor="middle">sobreasistencia:</text><text x="530" y="320" font-size="14" fill="#1f2937" text-anchor="middle">sedación profunda, soporte</text><text x="530" y="339" font-size="14" fill="#1f2937" text-anchor="middle">excesivo, auto-PEEP</text><line x1="190" y1="352" x2="300" y2="378" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/><line x1="530" y1="352" x2="420" y2="378" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/><rect x="60" y="380" width="600" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="360" y="402" font-size="14" fill="#1f2937" text-anchor="middle">4. Corrige la causa y una variable a la vez:</text><text x="360" y="421" font-size="14" fill="#1f2937" text-anchor="middle">trigger, flujo, Ti, ciclado, soporte, PEEP</text><line x1="360" y1="430" x2="360" y2="448" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/><rect x="60" y="450" width="600" height="32" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="360" y="472" font-size="14" fill="#1f2937" text-anchor="middle">5. Reevalúa: curvas, índice de asincronía, P0.1, ΔPocc</text><line x1="360" y1="482" x2="360" y2="498" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/><rect x="60" y="500" width="600" height="50" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/><text x="360" y="522" font-size="14" fill="#1f2937" text-anchor="middle">Si persiste: optimiza la sedoanalgesia, cambia de modo;</text><text x="360" y="541" font-size="14" fill="#1f2937" text-anchor="middle">en SDRA grave valora el bloqueo neuromuscular</text>
</svg>
