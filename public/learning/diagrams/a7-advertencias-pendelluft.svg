<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Pendelluft por esfuerzo intenso</title>
<desc id="d">Esquema comparativo de dos pulmones divididos en zona no dependiente y zona dependiente, con el diafragma contrayéndose debajo. En el pulmón sano la caída de presión pleural se reparte por igual y ambas zonas se inflan de forma proporcional. En el pulmón lesionado la presión pleural local cae mucho más en la zona dependiente (alrededor de menos 13 cmH2O) que en la no dependiente (alrededor de menos 6,4 cmH2O), y una flecha muestra el aire que pasa de la zona no dependiente a la dependiente al inicio de la inspiración, con sobredistensión local, sin cambio del volumen corriente medido.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><text x="360" y="30" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Esfuerzo inspiratorio intenso en el pulmón lesionado</text><text x="190" y="62" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">Pulmón sano</text><rect x="40" y="75" width="300" height="270" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><rect x="80" y="95" width="220" height="95" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><rect x="80" y="195" width="220" height="95" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="190" y="118" font-size="14" fill="#1f2937" text-anchor="middle">Zona no dependiente</text><text x="190" y="218" font-size="14" fill="#1f2937" text-anchor="middle">Zona dependiente</text><path d="M70,320 Q190,295 310,320" fill="none" stroke="#c2410c" stroke-width="3"/><text x="190" y="338" font-size="13" fill="#c2410c" text-anchor="middle">Diafragma que se contrae</text><text x="530" y="62" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">Pulmón lesionado (SDRA)</text><rect x="380" y="75" width="300" height="270" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><rect x="420" y="95" width="220" height="95" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><rect x="420" y="195" width="220" height="95" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="530" y="118" font-size="14" fill="#1f2937" text-anchor="middle">Zona no dependiente</text><text x="530" y="218" font-size="14" fill="#1f2937" text-anchor="middle">Zona dependiente</text><path d="M410,320 Q530,295 650,320" fill="none" stroke="#c2410c" stroke-width="3"/><text x="530" y="338" font-size="13" fill="#c2410c" text-anchor="middle">Diafragma que se contrae</text><text x="190" y="145" font-size="14" fill="#15803d" text-anchor="middle">La caída de presión pleural</text><text x="190" y="164" font-size="14" fill="#15803d" text-anchor="middle">se reparte de forma uniforme</text><text x="190" y="245" font-size="14" fill="#15803d" text-anchor="middle">Ambas zonas se inflan</text><text x="190" y="264" font-size="14" fill="#15803d" text-anchor="middle">de manera proporcional</text><text x="530" y="145" font-size="14" fill="#1d4ed8" text-anchor="middle">Ppl local ≈ −6,4 cmH₂O</text><text x="530" y="165" font-size="14" fill="#1d4ed8" text-anchor="middle">se desinfla al inicio</text><text x="530" y="245" font-size="14" fill="#b91c1c" text-anchor="middle">Ppl local ≈ −13,0 cmH₂O</text><text x="530" y="265" font-size="14" fill="#b91c1c" text-anchor="middle">sobredistensión local</text><path d="M645,150 C690,175 690,215 645,240" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ahr)"/><text x="700" y="200" font-size="13" fill="#b91c1c" text-anchor="middle" transform="rotate(90 700 200)">pendelluft</text><text x="360" y="378" font-size="14" fill="#1f2937" text-anchor="middle">El aire se desplaza entre regiones sin que cambie el volumen corriente medido.</text><text x="360" y="397" font-size="14" fill="#1f2937" text-anchor="middle">Valores medios de un modelo experimental porcino (Yoshida et al., 2013).</text>
</svg>
