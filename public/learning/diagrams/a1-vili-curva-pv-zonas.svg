<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d">
  <title id="t">Zonas de lesión sobre la curva presión-volumen</title>
  <desc id="d">Curva presión-volumen estática y sigmoidea de un pulmón con SDRA. En la parte baja, de pendiente casi plana, las unidades alveolares colapsan y se reabren en cada ciclo (atelectrauma). En la parte media, de pendiente máxima, la ventilación ocurre con el menor riesgo. En la parte alta, donde la curva vuelve a aplanarse, el pulmón se sobredistiende (volutrauma). Esquema ilustrativo, sin valores clínicos.</desc>
  <rect width="100%" height="100%" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="90" y="60" width="150" height="290" fill="#fee2e2"/>
    <rect x="240" y="60" width="200" height="290" fill="#dcfce7"/>
    <rect x="440" y="60" width="220" height="290" fill="#fee2e2"/>
    <line x1="90" y1="350" x2="670" y2="350" stroke="#9ca3af" stroke-width="2"/>
    <line x1="90" y1="350" x2="90" y2="50" stroke="#9ca3af" stroke-width="2"/>
    <path d="M90,335 C170,333 200,322 240,285 C290,236 350,152 440,118 C510,96 590,90 660,88" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <text x="165" y="84" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">Atelectrauma</text>
    <text x="165" y="104" font-size="14" fill="#1f2937" text-anchor="middle">colapso y</text>
    <text x="165" y="122" font-size="14" fill="#1f2937" text-anchor="middle">reapertura cíclica</text>
    <text x="340" y="84" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">Zona de menor riesgo</text>
    <text x="340" y="104" font-size="14" fill="#1f2937" text-anchor="middle">pendiente máxima:</text>
    <text x="340" y="122" font-size="14" fill="#1f2937" text-anchor="middle">mejor compliance</text>
    <text x="550" y="170" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">Volutrauma</text>
    <text x="550" y="190" font-size="14" fill="#1f2937" text-anchor="middle">sobredistensión:</text>
    <text x="550" y="208" font-size="14" fill="#1f2937" text-anchor="middle">la curva se aplana</text>
    <text x="250" y="320" font-size="14" fill="#1d4ed8">curva P-V estática</text>
    <line x1="240" y1="350" x2="240" y2="360" stroke="#1f2937" stroke-width="2"/>
    <text x="240" y="378" font-size="14" fill="#1f2937" text-anchor="middle">PEEP por encima</text>
    <text x="240" y="395" font-size="14" fill="#1f2937" text-anchor="middle">de la zona de colapso</text>
    <line x1="440" y1="350" x2="440" y2="360" stroke="#1f2937" stroke-width="2"/>
    <text x="440" y="378" font-size="14" fill="#1f2937" text-anchor="middle">Presión meseta por debajo</text>
    <text x="440" y="395" font-size="14" fill="#1f2937" text-anchor="middle">de la zona de sobredistensión</text>
    <text x="380" y="428" font-size="14" fill="#1f2937" text-anchor="middle">Presión en la vía aérea (cmH₂O)</text>
    <text x="40" y="205" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 40 205)">Volumen pulmonar (mL)</text>
  </g>
</svg>
