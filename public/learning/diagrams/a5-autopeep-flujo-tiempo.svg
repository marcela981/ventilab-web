    <text x="440" y="200" font-size="14" fill="#15803d" font-weight="700">el flujo vuelve a cero antes</text>
    <text x="440" y="218" font-size="14" fill="#1f2937">de la siguiente inspiración</text>
    <text x="104" y="86" font-size="13" fill="#1d4ed8">inspiración</text>
    <text x="170" y="226" font-size="13" fill="#1d4ed8">espiración</text>
    <line x1="90" y1="395" x2="680" y2="395" stroke="#9ca3af" stroke-width="2"/>
    <line x1="90" y1="315" x2="90" y2="485" stroke="#9ca3af" stroke-width="2"/>
    <text x="84" y="400" font-size="13" fill="#1f2937" text-anchor="end">0</text>
    <text x="100" y="303" font-size="15" fill="#1f2937" font-weight="700">Tiempo espiratorio corto</text>
    <text x="84" y="345" font-size="14" fill="#1f2937" text-anchor="end">+</text>
    <text x="84" y="470" font-size="14" fill="#1f2937" text-anchor="end">−</text>
