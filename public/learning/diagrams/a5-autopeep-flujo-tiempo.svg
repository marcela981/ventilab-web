    <text x="400" y="488" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="700">el flujo espiratorio no llega a cero:</text>
    <text x="400" y="506" font-size="14" fill="#1f2937" text-anchor="middle">atrapamiento aéreo y auto-PEEP</text>
    <text x="30" y="270" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 30 270)">Flujo (L/min)</text>
    <text x="640" y="540" font-size="14" fill="#1f2937" text-anchor="end">Tiempo (s)</text>
  </g>
</svg>
