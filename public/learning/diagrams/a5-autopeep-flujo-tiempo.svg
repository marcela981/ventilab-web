<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 556" width="720" height="556" role="img" aria-labelledby="t d">
  <title id="t">Flujo espiratorio y atrapamiento aéreo</title>
  <desc id="d">Dos curvas de flujo frente al tiempo en ventilación controlada por volumen con flujo inspiratorio constante. En la curva superior el tiempo espiratorio es suficiente y el flujo espiratorio decrece hasta cero antes de cada nueva inspiración. En la curva inferior la frecuencia es mayor, el tiempo espiratorio es corto y cada inspiración comienza cuando el flujo espiratorio aún es negativo, lo que indica atrapamiento aéreo y auto-PEEP. Esquema ilustrativo.</desc>
  <rect width="100%" height="100%" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <line x1="90" y1="150" x2="680" y2="150" stroke="#9ca3af" stroke-width="2"/>
    <line x1="90" y1="70" x2="90" y2="240" stroke="#9ca3af" stroke-width="2"/>
    <text x="84" y="155" font-size="13" fill="#1f2937" text-anchor="end">0</text>
    <text x="100" y="58" font-size="15" fill="#1f2937" font-weight="700">Tiempo espiratorio suficiente</text>
    <text x="84" y="100" font-size="14" fill="#1f2937" text-anchor="end">+</text>
    <text x="84" y="225" font-size="14" fill="#1f2937" text-anchor="end">−</text>
