<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Rangos objetivo de saturación de oxígeno</title>
<desc id="d">Gráfico de rangos horizontales sobre un eje de SpO2 de 84 a 100 por ciento. SDRA según el protocolo ARDSNet: 88 a 95 por ciento. Pacientes con riesgo de insuficiencia respiratoria hipercápnica según la guía BTS: 88 a 92 por ciento. Paciente agudo general según la guía BTS: 94 a 98 por ciento. Una línea discontinua roja en 96 por ciento indica la recomendación de no superar ese valor en pacientes médicos agudos.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<text x="360" y="32" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Rangos objetivo de SpO₂ según contexto clínico</text><line x1="290" y1="66" x2="290" y2="268" stroke="#9ca3af" stroke-width="1"/><text x="290" y="288" font-size="13" fill="#1f2937" text-anchor="middle">84</text><line x1="338.8" y1="66" x2="338.8" y2="268" stroke="#9ca3af" stroke-width="1"/><text x="338.8" y="288" font-size="13" fill="#1f2937" text-anchor="middle">86</text><line x1="387.5" y1="66" x2="387.5" y2="268" stroke="#9ca3af" stroke-width="1"/><text x="387.5" y="288" font-size="13" fill="#1f2937" text-anchor="middle">88</text><line x1="436.3" y1="66" x2="436.3" y2="268" stroke="#9ca3af" stroke-width="1"/><text x="436.3" y="288" font-size="13" fill="#1f2937" text-anchor="middle">90</text><line x1="485" y1="66" x2="485" y2="268" stroke="#9ca3af" stroke-width="1"/><text x="485" y="288" font-size="13" fill="#1f2937" text-anchor="middle">92</text><line x1="533.8" y1="66" x2="533.8" y2="268" stroke="#9ca3af" stroke-width="1"/><text x="533.8" y="288" font-size="13" fill="#1f2937" text-anchor="middle">94</text><line x1="582.5" y1="66" x2="582.5" y2="268" stroke="#9ca3af" stroke-width="1"/><text x="582.5" y="288" font-size="13" fill="#1f2937" text-anchor="middle">96</text><line x1="631.3" y1="66" x2="631.3" y2="268" stroke="#9ca3af" stroke-width="1"/><text x="631.3" y="288" font-size="13" fill="#1f2937" text-anchor="middle">98</text><line x1="680" y1="66" x2="680" y2="268" stroke="#9ca3af" stroke-width="1"/><text x="680" y="288" font-size="13" fill="#1f2937" text-anchor="middle">100</text><text x="485" y="314" font-size="14" fill="#1f2937" text-anchor="middle">SpO₂ (%)</text><text x="278" y="94" font-size="14" fill="#1f2937" text-anchor="end">SDRA (protocolo ARDSNet)</text><rect x="387.5" y="70" width="170.6" height="36" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="472.8" y="94" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="600">88–95 %</text><text x="278" y="156" font-size="14" fill="#1f2937" text-anchor="end">Riesgo de hipercapnia (BTS)</text><rect x="387.5" y="132" width="97.5" height="36" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="436.3" y="156" font-size="14" fill="#c2410c" text-anchor="middle" font-weight="600">88–92 %</text><text x="278" y="218" font-size="14" fill="#1f2937" text-anchor="end">Paciente agudo general (BTS)</text><rect x="533.8" y="194" width="97.5" height="36" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="637.3" y="218" font-size="14" fill="#15803d" font-weight="600">94–98 %</text><line x1="582.5" y1="44" x2="582.5" y2="268" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="7 5"/><text x="576.5" y="56" font-size="14" fill="#b91c1c" text-anchor="end">Límite superior: no superar 96 % (Siemieniuk et al., 2018)</text><text x="360" y="344" font-size="13" fill="#1f2937" text-anchor="middle">Fuentes: NHLBI ARDS Network (2008); O’Driscoll et al. (2017); Siemieniuk et al. (2018).</text>
</svg>
