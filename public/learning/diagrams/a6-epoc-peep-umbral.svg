<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d">
<title id="t">Respuesta a la PEEP externa con limitación al flujo espiratorio</title>
<desc id="d">Gráfica esquemática del volumen pulmonar de fin de espiración frente a la PEEP externa expresada como porcentaje de la auto-PEEP medida. En la respuesta típica de un paciente con limitación al flujo, el volumen se mantiene casi constante mientras la PEEP externa queda por debajo de un umbral cercano a la auto-PEEP, lo que reduce la carga para disparar sin añadir hiperinflación. Por encima de ese umbral el volumen sube y aparece hiperinflación adicional con repercusión hemodinámica. Una línea discontinua muestra la respuesta paradójica descrita en algunos pacientes, en la que el volumen baja con la PEEP.</desc>
