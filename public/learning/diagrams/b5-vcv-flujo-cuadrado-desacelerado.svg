<title id="t">Flujo constante frente a flujo desacelerado en VCV</title>
<desc id="d">Comparación de dos patrones de flujo inspiratorio en VCV con el mismo volumen corriente y el mismo tiempo inspiratorio. Arriba, el flujo cuadrado y la rampa descendente. Abajo, las presiones resultantes: con flujo cuadrado la presión sube en línea recta hasta un pico más alto; con flujo desacelerado la presión pico es menor, mientras que la presión meseta es la misma en ambos.</desc>
