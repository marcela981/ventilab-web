<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="t d">
<title id="t">Mapa de la interfaz de VentyLab</title>
<desc id="d">Esquema de la pantalla principal: a la izquierda el menú lateral con la marca VentyLab, las entradas Simulador Virtual, Módulo de Enseñanza, Evaluación y, solo para docentes, Panel docente; debajo el grupo Herramientas con el asistente IA y la campana de notificaciones, la tarjeta de usuario con el botón Opciones y la versión. A la derecha el área de contenido. Un recuadro muestra el menú Opciones con Perfil, Mi resumen, Mis notas, Mis calificaciones, Mi grupo y Cerrar sesión.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937">
<rect x="20" y="20" width="230" height="440" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="40" y="52" font-size="18" font-weight="700">VentyLab</text>
<text x="160" y="52" font-size="13" fill="#1d4ed8">Contraer menú</text>
<rect x="34" y="70" width="202" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="46" y="92" font-size="14">Simulador Virtual</text>
<circle cx="220" cy="87" r="5" fill="#15803d"/>
<rect x="34" y="110" width="202" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
<text x="46" y="132" font-size="14">Módulo de Enseñanza</text>
<rect x="34" y="150" width="202" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
<text x="46" y="172" font-size="14">Evaluación</text>
<line x1="34" y1="196" x2="236" y2="196" stroke="#9ca3af" stroke-dasharray="4 3"/>
<rect x="34" y="204" width="202" height="34" rx="6" fill="#ffffff" stroke="#6d28d9"/>
<text x="46" y="226" font-size="14">Panel docente</text>
<text x="46" y="256" font-size="13" fill="#6d28d9">(solo Docente y Administrador)</text>
<text x="40" y="292" font-size="14" font-weight="700">Herramientas</text>
<rect x="34" y="302" width="96" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
<text x="44" y="324" font-size="14">Asistente IA</text>
<rect x="140" y="302" width="96" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
<text x="150" y="324" font-size="14">Campana</text>
<circle cx="226" cy="306" r="9" fill="#b91c1c"/>
<text x="222" y="311" font-size="13" fill="#ffffff">3</text>
<rect x="34" y="352" width="202" height="54" rx="6" fill="#ffffff" stroke="#9ca3af"/>
<circle cx="58" cy="379" r="14" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="80" y="375" font-size="14">Nombre</text>
<text x="80" y="395" font-size="13" fill="#15803d">Estudiante</text>
<text x="200" y="385" font-size="14">⋮</text>
<text x="40" y="440" font-size="13" fill="#9ca3af">VentyLab v0.1.0</text>
<rect x="270" y="20" width="430" height="250" rx="10" fill="#ffffff" stroke="#9ca3af"/>
<text x="290" y="52" font-size="16" font-weight="700">Área de contenido</text>
<text x="290" y="80" font-size="14">Cambia según la entrada del menú:</text>
<text x="290" y="106" font-size="14">• /simulador: espacio del simulador</text>
<text x="290" y="130" font-size="14">• /learn: Aprender (lecciones)</text>
<text x="290" y="154" font-size="14">• /evaluations: evaluaciones</text>
<text x="290" y="178" font-size="14">• /teacher: panel docente propio</text>
<text x="290" y="214" font-size="13" fill="#1d4ed8">Punto verde: indicador del equipo físico</text>
<text x="290" y="236" font-size="13" fill="#b91c1c">Número rojo: notificaciones sin leer</text>
<rect x="270" y="290" width="430" height="170" rx="10" fill="#dcfce7" stroke="#15803d"/>
<text x="290" y="318" font-size="16" font-weight="700">Menú «Opciones» (botón ⋮)</text>
<text x="290" y="346" font-size="14">Perfil · Mi resumen · Mis notas</text>
<text x="290" y="370" font-size="14">Mis calificaciones · Mi grupo</text>
<text x="290" y="394" font-size="13" fill="#15803d">(los cuatro últimos solo para Estudiante)</text>
<text x="290" y="430" font-size="14" font-weight="700" fill="#b91c1c">Cerrar sesión</text>
<path d="M236 379 L270 379" stroke="#15803d" stroke-width="2" fill="none"/>
