<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="t d">
  <title id="t">Causas de alarma de presión alta frente a presión baja</title>
  <desc id="d">Comparación en dos columnas. Presión alta: causas de vía aérea y tubo (secreciones, tubo acodado o mordido, broncoespasmo, tos o lucha con el ventilador), en las que sube el pico con meseta estable; y causas de pulmón y tórax (caída de compliance, neumotórax, intubación selectiva, distensión abdominal), en las que suben pico y meseta. Presión baja o volumen bajo: desconexión, fuga por el manguito, fuga del circuito, extubación accidental y esfuerzo inspiratorio intenso en VCV; el volumen espirado es menor que el inspirado.</desc>
  <rect width="100%" height="100%" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" font-size="14">
    <!-- left column header -->
    <rect x="20" y="20" width="330" height="44" rx="8" fill="#b91c1c"/>
    <text x="185" y="48" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="16">ALARMA DE PRESIÓN ALTA</text>

    <rect x="20" y="76" width="330" height="170" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="34" y="100" font-weight="bold">Vía aérea y tubo</text>
    <text x="34" y="120" font-size="13" fill="#b91c1c">sube el pico, la meseta no cambia</text>
    <text x="40" y="146">• Secreciones</text>
    <text x="40" y="168">• Tubo acodado o mordido</text>
    <text x="40" y="190">• Broncoespasmo</text>
    <text x="40" y="212">• Tos o lucha con el ventilador</text>

    <rect x="20" y="258" width="330" height="170" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="34" y="282" font-weight="bold">Pulmón y tórax</text>
    <text x="34" y="302" font-size="13" fill="#b91c1c">suben el pico y la meseta</text>
    <text x="40" y="328">• Caída de la compliance</text>
    <text x="40" y="350">• Neumotórax</text>
    <text x="40" y="372">• Intubación selectiva</text>
    <text x="40" y="394">• Distensión abdominal</text>

    <!-- right column header -->
    <rect x="370" y="20" width="330" height="44" rx="8" fill="#1d4ed8"/>
    <text x="535" y="48" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="16">PRESIÓN BAJA / VOLUMEN BAJO</text>

    <rect x="370" y="76" width="330" height="352" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="384" y="100" font-weight="bold">Pérdida de gas</text>
    <text x="384" y="120" font-size="13" fill="#1d4ed8">Vte claramente menor que Vti</text>
    <text x="390" y="146">• Desconexión del circuito</text>
    <text x="390" y="168">• Fuga por el manguito</text>
    <text x="390" y="190">• Conexión floja o fuga del circuito</text>
    <text x="390" y="212">• Extubación accidental o tubo</text>
    <text x="402" y="232">desplazado hacia la glotis</text>
    <text x="384" y="270" font-weight="bold">Demanda del paciente (VCV)</text>
    <text x="390" y="296">• Esfuerzo inspiratorio intenso:</text>
    <text x="402" y="316">el paciente «tira» del gas</text>
    <text x="384" y="354" font-weight="bold">En PCV y PSV</text>
    <text x="390" y="380">• La presión no cambia: vigila</text>
    <text x="402" y="400">Vte y VE bajos</text>

    <text x="360" y="460" text-anchor="middle" font-size="14">Antes de la pantalla, mira al paciente</text>
  </g>
</svg>
