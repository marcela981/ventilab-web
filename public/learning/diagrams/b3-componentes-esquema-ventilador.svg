<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-labelledby="t d">
  <title id="t">Esquema funcional de un ventilador mecánico y su circuito</title>
  <desc id="d">Diagrama de bloques. Las fuentes de oxígeno y aire entran al mezclador, que fija la FiO2. El gas pasa por la válvula inspiratoria y el sensor de flujo inspiratorio, recorre la rama inspiratoria y el humidificador hasta la pieza en Y y el tubo endotraqueal del paciente. El gas espirado vuelve por la rama espiratoria, atraviesa el filtro y el sensor de flujo espiratorio y sale por la válvula espiratoria, que mantiene la PEEP. Un controlador electrónico recibe las señales de los sensores de presión y flujo y comanda ambas válvulas; la interfaz de usuario muestra curvas y alarmas. El espacio muerto del equipo está entre la pieza en Y y el paciente.</desc>
  <rect width="100%" height="100%" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937">
    <!-- controller -->
    <rect x="200" y="20" width="320" height="56" rx="8" fill="#f3f4f6" stroke="#6d28d9" stroke-width="2"/>
    <text x="360" y="44" font-size="15" font-weight="600" text-anchor="middle">Controlador electrónico</text>
    <text x="360" y="64" font-size="14" text-anchor="middle">compara lo programado con lo medido</text>
    <rect x="560" y="20" width="140" height="56" rx="8" fill="#f3f4f6" stroke="#6d28d9" stroke-width="2"/>
    <text x="630" y="44" font-size="14" font-weight="600" text-anchor="middle">Interfaz</text>
    <text x="630" y="64" font-size="14" text-anchor="middle">curvas y alarmas</text>
    <line x1="520" y1="48" x2="560" y2="48" stroke="#6d28d9" stroke-width="2"/>

    <!-- gas sources -->
    <rect x="20" y="110" width="90" height="40" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="65" y="135" font-size="14" text-anchor="middle">Oxígeno</text>
    <rect x="20" y="170" width="90" height="40" rx="6" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
    <text x="65" y="195" font-size="14" text-anchor="middle">Aire</text>
    <line x1="110" y1="130" x2="140" y2="155" stroke="#1f2937" stroke-width="2"/>
    <line x1="110" y1="190" x2="140" y2="165" stroke="#1f2937" stroke-width="2"/>
    <rect x="140" y="135" width="100" height="50" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="190" y="157" font-size="14" text-anchor="middle">Mezclador</text>
    <text x="190" y="175" font-size="14" text-anchor="middle">(FiO₂)</text>

    <!-- inspiratory valve and sensor -->
    <line x1="240" y1="160" x2="270" y2="160" stroke="#1d4ed8" stroke-width="3"/>
    <rect x="270" y="135" width="120" height="50" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="330" y="157" font-size="14" text-anchor="middle">Válvula</text>
    <text x="330" y="175" font-size="14" text-anchor="middle">inspiratoria</text>
    <line x1="390" y1="160" x2="420" y2="160" stroke="#1d4ed8" stroke-width="3"/>
    <rect x="420" y="140" width="96" height="40" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="468" y="165" font-size="14" text-anchor="middle">Sensor V̇, P</text>

    <!-- inspiratory limb -->
    <path d="M516,160 L600,160 L600,250" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <rect x="560" y="200" width="80" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="600" y="222" font-size="14" text-anchor="middle">Humidif.</text>
    <text x="530" y="128" font-size="14" fill="#1d4ed8">Rama inspiratoria</text>

    <!-- Y piece and patient -->
    <path d="M600,250 L600,290 L520,290" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="520" cy="290" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="520" y="322" font-size="14" text-anchor="middle">Pieza en Y</text>
    <line x1="520" y1="299" x2="520" y2="360" stroke="#c2410c" stroke-width="5"/>
    <rect x="455" y="360" width="130" height="44" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="520" y="379" font-size="14" text-anchor="middle">Paciente</text>
    <text x="520" y="397" font-size="14" text-anchor="middle">(tubo endotraqueal)</text>
    <text x="530" y="345" font-size="14" fill="#c2410c">espacio muerto del equipo</text>

    <!-- expiratory limb -->
    <path d="M511,290 L420,290 L420,250" fill="none" stroke="#15803d" stroke-width="3"/>
    <text x="300" y="318" font-size="14" fill="#15803d">Rama espiratoria</text>
    <rect x="370" y="215" width="100" height="34" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="420" y="237" font-size="14" text-anchor="middle">Filtro</text>
    <path d="M370,232 L330,232" fill="none" stroke="#15803d" stroke-width="3"/>
    <rect x="234" y="215" width="96" height="34" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="282" y="237" font-size="14" text-anchor="middle">Sensor V̇</text>
    <path d="M234,232 L200,232 L200,270" fill="none" stroke="#15803d" stroke-width="3"/>
    <rect x="130" y="270" width="140" height="50" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="200" y="292" font-size="14" text-anchor="middle">Válvula espiratoria</text>
    <text x="200" y="310" font-size="14" text-anchor="middle">(mantiene PEEP)</text>
    <path d="M200,320 L200,350" fill="none" stroke="#15803d" stroke-width="3"/>
    <text x="200" y="370" font-size="14" text-anchor="middle">salida al ambiente</text>

    <!-- control lines -->
    <g stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
      <path d="M300,76 L300,135"/>
      <path d="M468,76 L468,140"/>
      <path d="M230,76 L230,100 L125,100 L125,295 L130,295"/>
      <path d="M400,76 L400,120 L282,120 L282,215" />
    </g>
    <text x="20" y="430" font-size="14">Azul continuo: gas inspirado. Verde continuo: gas espirado.</text>
    <text x="20" y="450" font-size="14">Morado discontinuo: señales entre sensores, válvulas y controlador.</text>
  </g>
</svg>
