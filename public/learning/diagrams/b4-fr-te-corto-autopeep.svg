<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Tiempo espiratorio corto y auto-PEEP</title>
<desc id="d">Dos curvas de flujo frente al tiempo en un pulmón obstructivo con constante de tiempo cercana a 1 segundo. Arriba, con frecuencia de 16 por minuto el tiempo espiratorio es de 3 segundos y el flujo espiratorio vuelve casi a cero antes de la siguiente inspiración. Abajo, con frecuencia de 30 por minuto el tiempo espiratorio baja a 1,25 segundos y el flujo espiratorio no llega a cero: la siguiente inspiración empieza antes de vaciar el pulmón, lo que indica atrapamiento aéreo y auto-PEEP.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
