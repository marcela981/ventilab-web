<text x="125" y="300" font-size="14" fill="#1f2937" text-anchor="middle">Fijaciones alveolares</text>
<text x="125" y="320" font-size="14" fill="#1f2937" text-anchor="middle">tiran de la pared</text>
<text x="125" y="340" font-size="14" fill="#1f2937" text-anchor="middle">hacia fuera</text>
<text x="360" y="300" font-size="14" fill="#1f2937" text-anchor="middle">Pared engrosada y</text>
<text x="360" y="320" font-size="14" fill="#1f2937" text-anchor="middle">remodelada, moco,</text>
<text x="360" y="340" font-size="14" fill="#1f2937" text-anchor="middle">pérdida de fijaciones</text>
<text x="595" y="300" font-size="14" fill="#1f2937" text-anchor="middle">Músculo liso contraído,</text>
<text x="595" y="320" font-size="14" fill="#1f2937" text-anchor="middle">edema y tapón de moco:</text>
<text x="595" y="340" font-size="14" fill="#1f2937" text-anchor="middle">obstrucción variable</text>
<text x="360" y="376" font-size="13" fill="#1f2937" text-anchor="middle">Leyenda: azul = tabique alveolar; rojo claro = pared; morado = músculo liso; gris = moco</text>
<text x="360" y="398" font-size="13" fill="#1f2937" text-anchor="middle">Esquema didáctico, no a escala</text>
