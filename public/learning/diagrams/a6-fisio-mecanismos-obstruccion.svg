<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Mecanismos de obstrucción de la vía aérea pequeña</title>
<desc id="d">Tres cortes transversales esquemáticos de una vía aérea pequeña. A la izquierda, vía aérea normal con pared delgada, luz amplia y fijaciones alveolares que la mantienen abierta. En el centro, EPOC: pared engrosada, moco en la luz y pérdida de las fijaciones alveolares por enfisema, lo que reduce la tracción radial. A la derecha, asma en crisis: contracción del músculo liso, edema de la pared y tapón de moco que estrechan la luz de forma variable y reversible.</desc>
