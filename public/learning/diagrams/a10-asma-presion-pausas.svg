<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Presión en la vía aérea con pausas inspiratoria y espiratoria en obstrucción grave</title>
<desc id="d">Curva de presión frente a tiempo en ventilación controlada por volumen con flujo constante. La presión sube en rampa hasta un pico alto; durante la pausa inspiratoria cae a una presión meseta mucho menor, y la diferencia entre ambas refleja la resistencia de la vía aérea. En la pausa espiratoria final la presión se eleva por encima de la PEEP programada, lo que corresponde a la auto-PEEP. La presión meseta y la auto-PEEP son las que reflejan la hiperinflación.</desc>
