<line x1="86" y1="190" x2="700" y2="190" stroke="#f3f4f6" stroke-width="1"/>
<text x="80" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1f2937" text-anchor="end">30</text>
