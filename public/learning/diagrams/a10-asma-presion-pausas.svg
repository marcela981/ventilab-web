<line x1="90" y1="340" x2="700" y2="340" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="90" y1="340" x2="90" y2="60" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="86" y1="340" x2="700" y2="340" stroke="#f3f4f6" stroke-width="1"/>
