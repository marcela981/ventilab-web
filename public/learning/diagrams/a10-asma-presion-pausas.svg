<line x1="90" y1="315" x2="690" y2="315" stroke="#9ca3af" stroke-dasharray="5 4"/>
<text x="642" y="309" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">PEEP programada</text>
<text x="198" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="bold">Presión pico</text>
<text x="300" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#15803d" text-anchor="start" font-weight="bold">Presión meseta</text>
