<text x="80" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1f2937" text-anchor="end">40</text>
<line x1="86" y1="90" x2="700" y2="90" stroke="#f3f4f6" stroke-width="1"/>
<text x="80" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1f2937" text-anchor="end">50</text>
<text x="34" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 34 200)">Presión (cmH₂O)</text>
<text x="700" y="365" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1f2937" text-anchor="end">Tiempo (s)</text>
