<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="t d">
<title id="t">Volumen, presión alveolar y presión pleural en una respiración espontánea</title>
<desc id="d">Tres gráficas apiladas frente al tiempo, de 0 a 4 segundos; la inspiración ocupa de 0 a 2 segundos y la espiración de 2 a 4. Arriba, el volumen pulmonar sube de 0 a 0,5 litros y vuelve a 0. En el centro, la presión alveolar se hace ligeramente negativa durante la inspiración, vuelve a cero al final de la inspiración, se hace ligeramente positiva en la espiración y regresa a cero. Abajo, la presión pleural parte de menos 5 centímetros de agua y se hace más negativa hasta cerca de menos 7,5 al final de la inspiración; una línea discontinua muestra la parte puramente elástica y la curva continua, que se aleja de ella, incluye el componente resistivo. Valores ilustrativos.</desc>
