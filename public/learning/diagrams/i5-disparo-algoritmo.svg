<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" width="720" height="530" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Algoritmo de abordaje de las asincronías de disparo</title>
<desc id="d">Diagrama de flujo. Primero se compara la frecuencia respiratoria del paciente, observada en tórax y abdomen, con la registrada por el ventilador. Si la del paciente es mayor, hay esfuerzos ineficaces: se buscan auto-PEEP, soporte o volumen corriente excesivos y trigger poco sensible, y se corrige reduciendo soporte o tiempo inspiratorio, alargando el tiempo espiratorio, aplicando PEEP externa menor que la auto-PEEP y usando un trigger más sensible. Si la del ventilador es mayor, se sospecha autodisparo: se buscan fugas, agua en el circuito, oscilaciones cardiogénicas o trigger demasiado sensible, y se corrigen. Tras cada ajuste se reevalúan curvas, volumen, frecuencia, gases y confort.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<text x="360" y="32" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Abordaje de una asincronía de disparo</text><rect x="200" y="50" width="320" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="360" y="72" font-size="14" fill="#1f2937" text-anchor="middle">Compara la FR del paciente (tórax, abdomen)</text><text x="360" y="90" font-size="14" fill="#1f2937" text-anchor="middle">con la FR que registra el ventilador</text><line x1="300" y1="100" x2="150" y2="140" stroke="#1f2937" stroke-width="1.8"/><polygon fill="#1f2937" points="150,140 157.1,134.5 158.9,141.3"/><line x1="420" y1="100" x2="570" y2="140" stroke="#1f2937" stroke-width="1.8"/><polygon fill="#1f2937" points="570,140 561.1,141.3 562.9,134.5"/><rect x="30" y="140" width="250" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="155" y="163" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">FR paciente &gt; FR ventilador</text><text x="155" y="183" font-size="14" fill="#1f2937" text-anchor="middle">esfuerzos ineficaces</text><line x1="155" y1="196" x2="155" y2="226" stroke="#1f2937" stroke-width="1.8"/><polygon fill="#1f2937" points="155,226 151.5,217.7 158.5,217.7"/><rect x="30" y="226" width="250" height="128" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/><text x="42" y="248" font-size="14" fill="#1f2937" font-weight="600">Busca la causa:</text><text x="42" y="270" font-size="14" fill="#1f2937">• flujo espiratorio que no llega</text><text x="56" y="288" font-size="14" fill="#1f2937">a cero (auto-PEEP)</text><text x="42" y="310" font-size="14" fill="#1f2937">• soporte o Vt excesivos</text><text x="42" y="332" font-size="14" fill="#1f2937">• trigger poco sensible</text><line x1="155" y1="354" x2="155" y2="384" stroke="#1f2937" stroke-width="1.8"/><polygon fill="#1f2937" points="155,384 151.5,375.7 158.5,375.7"/><rect x="30" y="384" width="250" height="128" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="42" y="406" font-size="14" fill="#1f2937" font-weight="600">Corrige:</text><text x="42" y="428" font-size="14" fill="#1f2937">• ↓ soporte o Ti si Vt es alto</text><text x="42" y="450" font-size="14" fill="#1f2937">• alarga Te; trata la obstrucción</text><text x="42" y="472" font-size="14" fill="#1f2937">• PEEP externa &lt; auto-PEEP</text><text x="42" y="494" font-size="14" fill="#1f2937">• trigger más sensible (flujo)</text><rect x="440" y="140" width="250" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="565" y="163" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">FR ventilador &gt; FR paciente</text><text x="565" y="183" font-size="14" fill="#1f2937" text-anchor="middle">sospecha autodisparo</text><line x1="565" y1="196" x2="565" y2="226" stroke="#1f2937" stroke-width="1.8"/><polygon fill="#1f2937" points="565,226 561.5,217.7 568.5,217.7"/><rect x="440" y="226" width="250" height="128" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/><text x="452" y="248" font-size="14" fill="#1f2937" font-weight="600">Busca la causa:</text><text x="452" y="270" font-size="14" fill="#1f2937">• fuga (manguito, circuito, VNI)</text><text x="452" y="292" font-size="14" fill="#1f2937">• agua en el circuito</text><text x="452" y="314" font-size="14" fill="#1f2937">• oscilaciones cardiogénicas</text><text x="452" y="336" font-size="14" fill="#1f2937">• trigger demasiado sensible</text><line x1="565" y1="354" x2="565" y2="384" stroke="#1f2937" stroke-width="1.8"/><polygon fill="#1f2937" points="565,384 561.5,375.7 568.5,375.7"/><rect x="440" y="384" width="250" height="128" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="452" y="406" font-size="14" fill="#1f2937" font-weight="600">Corrige:</text><text x="452" y="428" font-size="14" fill="#1f2937">• repara la fuga</text><text x="452" y="450" font-size="14" fill="#1f2937">• drena la condensación</text><text x="452" y="472" font-size="14" fill="#1f2937">• reduce la sensibilidad</text><text x="452" y="494" font-size="14" fill="#1f2937">  hasta que desaparezca</text><rect x="300" y="250" width="120" height="210" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="360" y="274" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">Después</text><text x="360" y="296" font-size="14" fill="#1f2937" text-anchor="middle">de cada</text><text x="360" y="318" font-size="14" fill="#1f2937" text-anchor="middle">ajuste:</text><text x="360" y="344" font-size="14" fill="#1f2937" text-anchor="middle">reevalúa</text><text x="360" y="366" font-size="14" fill="#1f2937" text-anchor="middle">curvas,</text><text x="360" y="388" font-size="14" fill="#1f2937" text-anchor="middle">Vt, FR,</text><text x="360" y="410" font-size="14" fill="#1f2937" text-anchor="middle">gases y</text><text x="360" y="432" font-size="14" fill="#1f2937" text-anchor="middle">confort</text>
</svg>
