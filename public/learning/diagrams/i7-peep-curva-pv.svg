<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-labelledby="t d">
<title id="t">Curva presión-volumen y efecto de la PEEP</title>
<desc id="d">Curva estática presión-volumen en forma de S del sistema respiratorio. A la izquierda, zona de colapso con baja compliance; en el centro, zona lineal de mayor compliance; a la derecha, zona aplanada de sobredistensión. Una línea vertical marca la PEEP, otra la presión meseta, y la distancia entre ambas es la presión de distensión. Esquema ilustrativo sin valores clínicos.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937">
  <text x="360" y="32" font-size="18" font-weight="600" text-anchor="middle">La PEEP fija el punto de partida sobre la curva presión-volumen</text>
  <rect x="80" y="60" width="140" height="320" fill="#fee2e2"/>
  <rect x="220" y="60" width="280" height="320" fill="#dcfce7"/>
  <rect x="500" y="60" width="160" height="320" fill="#fee2e2"/>
  <text x="150" y="84" font-size="14" text-anchor="middle">Colapso</text>
  <text x="150" y="102" font-size="14" text-anchor="middle">(atelectrauma)</text>
  <text x="360" y="84" font-size="14" text-anchor="middle">Zona de mayor compliance</text>
  <text x="580" y="84" font-size="14" text-anchor="middle">Sobredistensión</text>
  <line x1="80" y1="380" x2="670" y2="380" stroke="#9ca3af" stroke-width="2"/>
  <line x1="80" y1="380" x2="80" y2="56" stroke="#9ca3af" stroke-width="2"/>
  <g font-size="13" text-anchor="middle" fill="#1f2937">
    <line x1="80" y1="380" x2="80" y2="386" stroke="#9ca3af"/><text x="80" y="400">0</text>
    <line x1="225" y1="380" x2="225" y2="386" stroke="#9ca3af"/><text x="225" y="400">10</text>
    <line x1="370" y1="380" x2="370" y2="386" stroke="#9ca3af"/><text x="370" y="400">20</text>
    <line x1="515" y1="380" x2="515" y2="386" stroke="#9ca3af"/><text x="515" y="400">30</text>
    <line x1="660" y1="380" x2="660" y2="386" stroke="#9ca3af"/><text x="660" y="400">40</text>
  </g>
  <text x="375" y="426" font-size="14" text-anchor="middle">Presión en la vía aérea (cmH₂O)</text>
  <text x="40" y="220" font-size="14" text-anchor="middle" transform="rotate(-90 40 220)">Volumen pulmonar (mL)</text>
  <path d="M80,375 C150,372 190,352 215,322 L495,118 C540,88 600,76 655,72" fill="none" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="255" y1="380" x2="255" y2="140" stroke="#15803d" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="460" y1="380" x2="460" y2="140" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="255" y="134" font-size="14" font-weight="600" text-anchor="middle" fill="#15803d">PEEP</text>
  <text x="460" y="134" font-size="14" font-weight="600" text-anchor="middle" fill="#c2410c">Presión meseta</text>
  <line x1="262" y1="160" x2="453" y2="160" stroke="#1f2937" stroke-width="2"/>
  <path d="M262,160 l10,-6 l0,12 z M453,160 l-10,-6 l0,12 z" fill="#1f2937"/>
  <text x="357" y="182" font-size="14" text-anchor="middle">ΔP (volumen corriente)</text>
  <circle cx="255" cy="292" r="6" fill="#15803d"/>
  <circle cx="460" cy="143" r="6" fill="#c2410c"/>
  <text x="585" y="112" font-size="14" text-anchor="middle" fill="#1d4ed8">Curva de inflación</text>
  <text x="375" y="448" font-size="13" text-anchor="middle" fill="#1f2937">Esquema ilustrativo: la posición de las zonas varía entre pacientes.</text>
</g>
</svg>
