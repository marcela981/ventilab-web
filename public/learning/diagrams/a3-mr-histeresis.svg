y2="366" stroke="#9ca3af" stroke-width="1"/><text x="615.6" y="382" font-size="13" fill="#1f2937" text-anchor="middle">40</text><line x1="100" y1="360" x2="680" y2="360" stroke="#9ca3af" stroke-width="1.5"/><line x1="100" y1="70" x2="100" y2="360" stroke="#9ca3af" stroke-width="1.5"/><text x="390" y="406" font-size="14" fill="#1f2937" text-anchor="middle">Presión en la vía aérea (cmH₂O)</text><text x="48" y="215" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 48 215)">Volumen pulmonar (mL)</text><text x="360" y="36" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Histéresis de la curva presión-volumen en el SDRA</text><polyline points="100,358.9 106.4,358.7 112.9,358.6 119.3,358.4 125.8,358.2 132.2,357.9 138.7,357.6 145.1,357.3 151.6,357 158,356.6 164.4,356.1 170.9,355.6 177.3,355 183.8,354.4 190.2,353.7 196.7,352.8 203.1,351.9 209.6,350.9 216,349.7 222.4,348.4 228.9,346.9 235.3,345.3 241.8,343.4 248.2,341.4 254.7,339.1 261.1,336.6 267.6,333.7 274,330.6 280.4,327.2 286.9,323.4 293.3,319.2 299.8,314.7 306.2,309.7 312.7,304.4 319.1,298.6 325.6,292.5 332,285.9 338.4,278.9 344.9,271.6 351.3,263.9 357.8,256 364.2,247.8 370.7,239.4 377.1,230.8 383.6,222.3 390,213.7 396.4,205.1 402.9,196.7 409.3,188.5 415.8,180.6 422.2,172.9 428.7,165.6 435.1,158.6 441.6,152 448,145.9 454.4,140.1 460.9,134.8 467.3,129.8 473.8,125.3 480.2,121.1 486.7,117.3 493.1,113.9 499.6,110.8 506,107.9 512.4,105.4 518.9,103.1 525.3,101.1 531.8,99.2 538.2,97.6 544.7,96.1 551.1,94.8 557.6,93.6 564,92.6 570.4,91.7 576.9,90.8 583.3,90.1 589.8,89.5 596.2,88.9 602.7,88.4 609.1,87.9 615.6,87.5 622,87.2 628.4,86.9 634.9,86.6 641.3,86.3 647.8,86.1 654.2,85.9 660.7,85.8 667.1,85.6 673.6,85.5 680,85.4" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/><polyline points="680,84.6 673.6,84.6 667.1,84.6 660.7,84.6 654.2,84.6 647.8,84.6 641.3,84.6 634.9,84.7 628.4,84.7 622,84.7 615.6,84.7 609.1,84.8 602.7,84.8 596.2,84.8 589.8,84.9 583.3,84.9 576.9,84.