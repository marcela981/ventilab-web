<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Histéresis de la curva presión-volumen</title>
<desc id="d">Gráfico de volumen pulmonar frente a presión en la vía aérea. La rama de insuflado, en azul y continua, es plana a baja presión y sube bruscamente en la zona intermedia. La rama de desinsuflado, en rojo y discontinua, queda por encima. Una línea vertical en la PEEP corta la rama de desinsuflado a un volumen mucho mayor que la de insuflado, lo que muestra que el pulmón reclutado conserva más volumen con la misma PEEP.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
