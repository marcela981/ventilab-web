<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="t d">
  <title id="t">Salvaguardas del envío automático en el modo real</title>
  <desc id="d">Diagrama de flujo vertical. Cambias un valor en la consola. La plataforma espera unos 500 milisegundos sin cambios nuevos. Pregunta si el valor está dentro del rango seguro: si no, el control queda como Rechazado, no se envía nada y vuelve al último valor aplicado. Si está dentro, pregunta si hay un comando en vuelo: si lo hay, el cambio se acumula y sale después con el último valor de cada parámetro. Si no, se envía al servidor, que valida otra vez reserva, control, frecuencia, rangos y coherencia de tiempos antes de publicarlo al equipo. El estado por parámetro pasa de Enviando a Aplicado o Rechazado. Deshacer último cambio reenvía los valores anteriores por el mismo camino.</desc>
  <rect width="100%" height="100%" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937">
    <rect x="130" y="20" width="240" height="44" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="250" y="48" font-size="15" font-weight="600" text-anchor="middle">Cambias un valor</text>
    <line x1="250" y1="64" x2="250" y2="85" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
    <rect x="130" y="88" width="240" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="250" y="116" font-size="14" text-anchor="middle">espera ~500 ms sin cambios</text>
    <line x1="250" y1="132" x2="250" y2="151" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>

    <path d="M250,154 L370,194 L250,234 L130,194 Z" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <text x="250" y="190" font-size="14" text-anchor="middle">¿Dentro del</text>
    <text x="250" y="208" font-size="14" text-anchor="middle">rango seguro?</text>
    <line x1="370" y1="194" x2="437" y2="194" stroke="#b91c1c" stroke-width="2" marker-end="url(#a)"/>
    <text x="400" y="186" font-size="14" text-anchor="middle" fill="#b91c1c">no</text>
    <rect x="440" y="160" width="260" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="570" y="184" font-size="14" font-weight="600" text-anchor="middle">Rechazado: no se envía</text>
    <text x="570" y="204" font-size="14" text-anchor="middle">el control vuelve al último</text>
    <text x="570" y="222" font-size="14" text-anchor="middle">valor aplicado</text>
    <line x1="250" y1="234" x2="250" y2="257" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
    <text x="262" y="252" font-size="14">sí</text>

    <path d="M250,260 L370,300 L250,340 L130,300 Z" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <text x="250" y="296" font-size="14" text-anchor="middle">¿Comando</text>
    <text x="250" y="314" font-size="14" text-anchor="middle">en vuelo?</text>
    <line x1="370" y1="300" x2="437" y2="300" stroke="#c2410c" stroke-width="2" marker-end="url(#a)"/>
    <text x="400" y="292" font-size="14" text-anchor="middle" fill="#c2410c">sí</text>
    <rect x="440" y="266" width="260" height="70" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
    <text x="570" y="290" font-size="14" font-weight="600" text-anchor="middle">Se acumula</text>
    <text x="570" y="310" font-size="14" text-anchor="middle">sale al terminar el anterior,</text>
    <text x="570" y="328" font-size="14" text-anchor="middle">con el último valor</text>
    <line x1="250" y1="340" x2="250" y2="363" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
    <text x="262" y="358" font-size="14">no</text>

    <rect x="100" y="366" width="300" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="250" y="390" font-size="14" font-weight="600" text-anchor="middle">El servidor valida otra vez</text>
    <text x="250" y="410" font-size="14" text-anchor="middle">reserva, control, frecuencia,</text>
    <text x="250" y="428" font-size="14" text-anchor="middle">rangos y coherencia de tiempos</text>
    <line x1="250" y1="436" x2="250" y2="459" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
    <rect x="100" y="462" width="300" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="250" y="486" font-size="14" font-weight="600" text-anchor="middle">Equipo físico</text>
    <text x="250" y="506" font-size="14" text-anchor="middle">Enviando → Aplicado o Rechazado</text>

    <rect x="440" y="380" width="260" height="96" rx="8" fill="#f3f4f6" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="570" y="406" font-size="14" font-weight="600" text-anchor="middle">Deshacer último cambio</text>
    <text x="570" y="428" font-size="14" text-anchor="middle">reenvía los valores previos</text>
    <text x="570" y="448" font-size="14" text-anchor="middle">por el mismo camino y</text>
    <text x="570" y="466" font-size="14" text-anchor="middle">con la misma validación</text>
    <line x1="440" y1="410" x2="374" y2="110" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  </g>
</svg>
