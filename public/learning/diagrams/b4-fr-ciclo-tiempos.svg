<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Tiempos del ciclo ventilatorio en VCV</title>
<desc id="d">Dos curvas frente al tiempo durante dos ciclos en ventilación controlada por volumen. Arriba, presión en la vía aérea: rampa lineal desde la PEEP hasta la presión pico, caída a la meseta durante la pausa y descenso a la PEEP en la espiración. Abajo, flujo: onda cuadrada positiva durante la inspiración, cero en la pausa y flujo espiratorio negativo que decae hasta cero. Se señalan el tiempo inspiratorio de flujo de 0,45 s, la pausa de 0,3 s, el tiempo espiratorio de 3 s y el ciclo total de 3,75 s, con relación I:E de 1:4.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><text x="360" y="30" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Tiempos del ciclo en VCV con flujo constante y pausa inspiratoria</text><text x="360" y="52" font-size="14" fill="#1f2937" text-anchor="middle">Ejemplo: FR 16 rpm, Vt 450 mL, flujo 60 L/min, pausa 0,3 s</text><line x1="90" y1="230" x2="690" y2="230" stroke="#9ca3af" stroke-width="1"/><text x="82" y="235" font-size="13" fill="#1f2937" text-anchor="end">0</text><line x1="90" y1="204" x2="690" y2="204" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2 4"/><text x="82" y="209" font-size="13" fill="#1f2937" text-anchor="end">5</text><line x1="90" y1="178" x2="690" y2="178" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2 4"/><text x="82" y="183" font-size="13" fill="#1f2937" text-anchor="end">10</text><line x1="90" y1="152" x2="690" y2="152" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2 4"/><text x="82" y="157" font-size="13" fill="#1f2937" text-anchor="end">15</text><line x1="90" y1="126" x2="690" y2="126" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2 4"/><text x="82" y="131" font-size="13" fill="#1f2937" text-anchor="end">20</text><line x1="90" y1="100" x2="690" y2="100" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2 4"/><text x="82" y="105" font-size="13" fill="#1f2937" text-anchor="end">25</text><line x1="90" y1="457.9" x2="690" y2="457.9" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2 4"/><text x="82" y="462.9" font-size="13" fill="#1f2937" text-anchor="end">-60</text><line x1="90" y1="421.4" x2="690" y2="421.4" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2 4"/><text x="82" y="426.4" font-size="13" fill="#1f2937" text-anchor="end">-30</text><line x1="90" y1="385" x2="690" y2="385" stroke="#1f2937" stroke-width="1"/><text x="82" y="390" font-size="13" fi