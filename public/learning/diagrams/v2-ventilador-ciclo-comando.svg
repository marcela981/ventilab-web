<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t d">
<title id="t">Recorrido de un cambio en el equipo real</title>
<desc id="d">Diagrama de flujo del envío automático en modo Real: el operador cambia un parámetro; tras 500 ms sin más cambios se valida contra el rango seguro; si está fuera de rango queda Rechazado y el control vuelve al último valor aplicado; si está dentro y no hay otro comando en vuelo se envía y el parámetro muestra Enviando; si hay uno en vuelo, los cambios esperan y salen juntos. El servidor vuelve a validar y publica en el broker; el equipo aplica el cambio y la telemetría lo informa, y entonces el parámetro muestra Aplicado. Si el servidor rechaza, se muestra Rechazado con el motivo. La consola siempre muestra el valor que informa el equipo.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker></defs>
<rect x="20" y="24" width="190" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="34" y="48" font-size="14" font-weight="700">1. Cambias un valor</text>
<text x="34" y="68" font-size="13">+/−, rueda, teclado o slider</text>
<line x1="210" y1="52" x2="258" y2="52" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="260" y="24" width="190" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="274" y="48" font-size="14" font-weight="700">2. Espera de 500 ms</text>
<text x="274" y="68" font-size="13">sin cambios nuevos</text>
<line x1="450" y1="52" x2="498" y2="52" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<polygon points="600,14 700,52 600,90 500,52" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="548" y="48" font-size="13" font-weight="700">3. ¿Rango</text>
<text x="556" y="66" font-size="13" font-weight="700">seguro?</text>
<line x1="600" y1="90" x2="600" y2="138" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="608" y="120" font-size="13">no</text>
<rect x="500" y="140" width="200" height="64" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
<text x="514" y="166" font-size="14" font-weight="700" fill="#b91c1c">Rechazado</text>
<text x="514" y="188" font-size="13">vuelve al valor aplicado</text>
<path d="M520 70 C 440 130 380 120 360 138" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="440" y="112" font-size="13">sí</text>
<polygon points="250,140 370,174 250,208 130,174" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="182" y="170" font-size="13" font-weight="700">4. ¿Otro comando</text>
<text x="200" y="188" font-size="13" font-weight="700">en vuelo?</text>
<line x1="130" y1="174" x2="70" y2="174" stroke="#1f2937" stroke-width="2"/>
<line x1="70" y1="174" x2="70" y2="110" stroke="#1f2937" stroke-width="2"/>
<line x1="70" y1="110" x2="140" y2="110" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="24" y="200" font-size="13">sí: espera y</text>
<text x="24" y="218" font-size="13">se agrupa</text>
<text x="150" y="114" font-size="13">sale al terminar el anterior</text>
<line x1="250" y1="208" x2="250" y2="258" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="258" y="240" font-size="13">no</text>
<rect x="150" y="260" width="200" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="164" y="284" font-size="14" font-weight="700">Enviando</text>
<text x="164" y="304" font-size="13">el servidor valida otra vez</text>
<line x1="350" y1="288" x2="398" y2="288" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="400" y="260" width="140" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="414" y="284" font-size="14" font-weight="700">Broker MQTT</text>
<text x="414" y="304" font-size="13">→ equipo</text>
<line x1="540" y1="288" x2="588" y2="288" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="590" y="260" width="110" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
<text x="602" y="284" font-size="14" font-weight="700">Telemetría</text>
<text x="602" y="304" font-size="13">informa</text>
<line x1="645" y1="316" x2="645" y2="358" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="500" y="360" width="200" height="56" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="514" y="384" font-size="14" font-weight="700" fill="#15803d">Aplicado</text>
<text x="514" y="404" font-size="13">el equipo informa el valor</text>
<line x1="250" y1="316" x2="250" y2="358" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="130" y="360" width="250" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
<text x="144" y="384" font-size="14" font-weight="700" fill="#b91c1c">Rechazado: motivo</text>
<text x="144" y="404" font-size="13">del servidor o sin confirmación</text>
<text x="24" y="448" font-size="14" font-weight="700">«Deshacer último cambio» reenvía los valores previos por este mismo camino.</text>
</g>
</svg>
