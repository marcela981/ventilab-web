<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d">
  <title id="t">Dos caminos para reservar el ventilador físico</title>
  <desc id="d">A la izquierda, un esquema del calendario de Reservas del ventilador con tres días en columnas y cuatro franjas en filas. Cada celda está rotulada: Pasado, Ocupado o Reservar, según su estado. A la derecha, dos caminos de reserva: desde la pestaña Conexión con Reservar ahora, que reserva desde este momento por 15, 30, 45 o 60 minutos, y desde Ver calendario, eligiendo una franja libre y completando el diálogo Reservar el ventilador. Ambos terminan en Mis reservas, con las secciones Próximas y Anteriores y el botón Cancelar.</desc>
  <rect width="100%" height="100%" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937">
    <text x="20" y="32" font-size="15" font-weight="600">Reservas del ventilador (vista Semana)</text>
    <text x="20" y="72" font-size="14">Hora</text>
    <text x="96" y="72" font-size="14" text-anchor="middle">Lun</text>
    <text x="186" y="72" font-size="14" text-anchor="middle">Mar</text>
    <text x="276" y="72" font-size="14" text-anchor="middle">Mié</text>
    <text x="20" y="108" font-size="14">8:00</text>
    <text x="20" y="150" font-size="14">8:15</text>
    <text x="20" y="192" font-size="14">8:30</text>
    <text x="20" y="234" font-size="14">8:45</text>

    <rect x="56" y="84" width="80" height="38" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="96" y="108" font-size="14" text-anchor="middle">Pasado</text>
    <rect x="56" y="126" width="80" height="38" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="96" y="150" font-size="14" text-anchor="middle">Pasado</text>
    <rect x="56" y="168" width="80" height="38" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="96" y="192" font-size="14" text-anchor="middle">Ocupado</text>
    <rect x="56" y="210" width="80" height="38" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="96" y="234" font-size="14" text-anchor="middle">Ocupado</text>

    <rect x="146" y="84" width="80" height="38" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="186" y="108" font-size="14" text-anchor="middle" fill="#15803d">Reservar</text>
    <rect x="146" y="126" width="80" height="38" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="186" y="150" font-size="14" text-anchor="middle" fill="#15803d">Reservar</text>
    <rect x="146" y="168" width="80" height="38" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="186" y="192" font-size="14" text-anchor="middle">Ocupado</text>
    <rect x="146" y="210" width="80" height="38" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="186" y="234" font-size="14" text-anchor="middle" fill="#15803d">Reservar</text>

    <rect x="236" y="84" width="80" height="38" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="276" y="108" font-size="14" text-anchor="middle" fill="#15803d">Reservar</text>
    <rect x="236" y="126" width="80" height="38" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="276" y="150" font-size="14" text-anchor="middle" fill="#15803d">Reservar</text>
    <rect x="236" y="168" width="80" height="38" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="276" y="192" font-size="14" text-anchor="middle" fill="#15803d">Reservar</text>
    <rect x="236" y="210" width="80" height="38" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="276" y="234" font-size="14" text-anchor="middle" fill="#15803d">Reservar</text>

    <text x="20" y="276" font-size="14">Franjas de 15 min · horario de Bogotá</text>
    <text x="20" y="298" font-size="14">Un estudiante ve «Ocupado», nunca el nombre</text>
    <text x="20" y="318" font-size="14">de otra persona.</text>

    <rect x="370" y="44" width="330" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="535" y="70" font-size="15" font-weight="600" text-anchor="middle">Conexión → «Reservar ahora»</text>
    <text x="535" y="94" font-size="14" text-anchor="middle">desde ahora · 15, 30, 45 o 60 min</text>
    <rect x="370" y="140" width="330" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="535" y="166" font-size="15" font-weight="600" text-anchor="middle">«Ver calendario» → franja libre</text>
    <text x="535" y="190" font-size="14" text-anchor="middle">diálogo «Reservar el ventilador»</text>
    <line x1="316" y1="145" x2="367" y2="170" stroke="#1f2937" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>

    <rect x="370" y="262" width="330" height="98" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="535" y="288" font-size="15" font-weight="600" text-anchor="middle">Mis reservas</text>
    <text x="535" y="312" font-size="14" text-anchor="middle">Próximas (la actual dice «En curso»)</text>
    <text x="535" y="334" font-size="14" text-anchor="middle">Anteriores · botón «Cancelar»</text>
    <line x1="420" y1="114" x2="420" y2="259" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
    <line x1="600" y1="210" x2="600" y2="259" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>

    <rect x="20" y="380" width="680" height="44" rx="8" fill="#f3f4f6"/>
    <text x="36" y="407" font-size="14">Al terminar, «Liberar» deja el equipo disponible para la siguiente persona.</text>
  </g>
</svg>
