<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Línea de tiempo de un día de prono</title>
<desc id="d">Barra horizontal de 24 horas. Las primeras 17 horas, en azul, corresponden al prono de al menos 16 horas, con triángulos naranjas cada pocas horas que indican cambios de posición de cabeza y brazos. Las últimas horas, en verde, corresponden al supino. Se señalan el giro con un equipo de 4 a 5 personas, la comprobación posterior del tubo y la mecánica, la vuelta a supino y la gasometría de reevaluación a las 4 horas en supino.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<defs><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><text x="360" y="34" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Un día de tratamiento: sesión prolongada y reevaluación</text><rect x="60" y="90" width="439.2" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="499.2" y="90" width="180.8" height="60" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="279.6" y="126" font-size="16" fill="#1d4ed8" text-anchor="middle" font-weight="700">PRONO (al menos 16 h)</text><text x="589.6" y="126" font-size="16" fill="#15803d" text-anchor="middle" font-weight="700">SUPINO</text><line x1="60" y1="150" x2="60" y2="160" stroke="#1f2937" stroke-width="1"/><text x="60" y="178" font-size="13" fill="#1f2937" text-anchor="middle">0 h</text><line x1="163.3" y1="150" x2="163.3" y2="160" stroke="#1f2937" stroke-width="1"/><text x="163.3" y="178" font-size="13" fill="#1f2937" text-anchor="middle">4 h</text><line x1="266.7" y1="150" x2="266.7" y2="160" stroke="#1f2937" stroke-width="1"/><text x="266.7" y="178" font-size="13" fill="#1f2937" text-anchor="middle">8 h</text><line x1="370" y1="150" x2="370" y2="160" stroke="#1f2937" stroke-width="1"/><text x="370" y="178" font-size="13" fill="#1f2937" text-anchor="middle">12 h</text><line x1="473.3" y1="150" x2="473.3" y2="160" stroke="#1f2937" stroke-width="1"/><text x="473.3" y="178" font-size="13" fill="#1f2937" text-anchor="middle">16 h</text><line x1="576.7" y1="150" x2="576.7" y2="160" stroke="#1f2937" stroke-width="1"/><text x="576.7" y="178" font-size="13" fill="#1f2937" text-anchor="middle">20 h</text><line x1="680" y1="150" x2="680" y2="160" stroke="#1f2937" stroke-width="1"/><text x="680" y="178" font-size="13" fill="#1f2937" text-anchor="middle">24 h</text><path d="M 137.5 86 l -6 -12 l 12 0 z" fill="#c2410c"/><path d="M 215 86 l -6 -12 l 12 0 z" fill="#c2410c"/><path d="M 292.5 86 l -6 -12 l 12 0 z" fill="#c2410c"/><path d="M 370 86 l -6 -12 l 12 0 z" fill="#c2410c"/><path d="M 447.5 86 l -6 -12 l 12 0 z" fill="#c2410c"/><text x="60" y="64" font-size="14" fill="#c2410c">Triángulos: cambio de posición de cabeza y brazos (cada 2 a 4 h)</text><line x1="60" y1="186" x2="60" y2="272" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 3"/><text x="66" y="290" font-size="14" fill="#1d4ed8" text-anchor="start" font-weight="600">Giro a prono:</text><text x="66" y="308" font-size="14" fill="#1d4ed8" text-anchor="start">equipo de 4-5, líder en vía aérea</text><line x1="85.8" y1="186" x2="85.8" y2="212" stroke="#1f2937" stroke-width="2" stroke-dasharray="4 3"/><text x="91.8" y="230" font-size="14" fill="#1f2937" text-anchor="start" font-weight="600">Comprobación: tubo, capnografía,</text><text x="91.8" y="248" font-size="14" fill="#1f2937" text-anchor="start">Pplat, puntos de apoyo</text><line x1="499.2" y1="186" x2="499.2" y2="212" stroke="#15803d" stroke-width="2" stroke-dasharray="4 3"/><text x="493.2" y="230" font-size="14" fill="#15803d" text-anchor="end" font-weight="600">Vuelta a supino</text><line x1="602.5" y1="186" x2="602.5" y2="272" stroke="#15803d" stroke-width="2" stroke-dasharray="4 3"/><text x="596.5" y="290" font-size="14" fill="#15803d" text-anchor="end" font-weight="600">A las 4 h en supino:</text><text x="596.5" y="308" font-size="14" fill="#15803d" text-anchor="end">gasometría y decisión</text><text x="60" y="360" font-size="13" fill="#1f2937">Esquema de un ciclo diario basado en el protocolo PROSEVA. Duración real según la evolución.</text>
</svg>
