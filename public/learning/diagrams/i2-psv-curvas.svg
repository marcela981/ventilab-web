<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="t d">
<title id="t">Curvas de presión y flujo en presión de soporte</title>
<desc id="d">Dos gráficos apilados de dos respiraciones en PSV. En la presión: una pequeña caída bajo la PEEP marca el esfuerzo que dispara, la presión sube según el rise time hasta PEEP más soporte y se mantiene hasta el ciclado. En el flujo: pico precoz, caída progresiva y ciclado a espiración cuando el flujo baja al 25 por ciento del pico, marcado con una línea discontinua; luego flujo espiratorio negativo que vuelve a cero.</desc>
