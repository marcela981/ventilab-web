<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Compliance frente a PEEP en prueba decremental</title>
<desc id="d">Gráfico de compliance del sistema respiratorio frente a PEEP, con la PEEP disminuyendo de 20 a 10 cmH2O de izquierda a derecha. La compliance sube de 25 a un máximo de 32 mL/cmH2O a PEEP 14 y luego baja a 26,7 a PEEP 10. La zona izquierda está sombreada en rojo y rotulada como predominio de sobredistensión; la derecha, en azul, como predominio de colapso.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<rect x="100" y="70" width="280.3" height="280" fill="#fee2e2"/><rect x="496.3" y="70" width="183.7" height="280" fill="#dbeafe"/><line x1="100" y1="350" x2="680" y2="350" stroke="#f3f4f6" stroke-width="1"/><text x="92" y="355" font-size="13" fill="#1f2937" text-anchor="end">20</text><line x1="100" y1="256.7" x2="680" y2="256.7" stroke="#f3f4f6" stroke-width="1"/><text x="92" y="261.7" font-size="13" fill="#1f2937" text-anchor="end">25</text><line x1="100" y1="163.3" x2="680" y2="163.3" stroke="#f3f4f6" stroke-width="1"/><text x="92" y="168.3" font-size="13" fill="#1f2937" text-anchor="end">30</text><line x1="100" y1="70" x2="680" y2="70" stroke="#f3f4f6" stroke-width="1"/><text x="92" y="75" font-size="13" fill="#1f2937" text-anchor="end">35</text><line x1="148.3" y1="350" x2="148.3" y2="356" stroke="#9ca3af" stroke-width="1"/><text x="148.3" y="372" font-size="13" fill="#1f2937" text-anchor="middle">20</text><line x1="245" y1="350" x2="245" y2="356" stroke="#9ca3af" stroke-width="1"/><text x="245" y="372" font-size="13" fill="#1f2937" text-anchor="middle">18</text><line x1="341.7" y1="350" x2="341.7" y2="356" stroke="#9ca3af" stroke-width="1"/><text x="341.7" y="372" font-size="13" fill="#1f2937" text-anchor="middle">16</text><line x1="438.3" y1="350" x2="438.3" y2="356" stroke="#9ca3af" stroke-width="1"/><text x="438.3" y="372" font-size="13" fill="#1f2937" text-anchor="middle">14</text><line x1="535" y1="350" x2="535" y2="356" stroke="#9ca3af" stroke-width="1"/><text x="535" y="372" font-size="13" fill="#1f2937" text-anchor="middle">12</text><line x1="631.7" y1="350" x2="631.7" y2="356" stroke="#9ca3af" stroke-width="1"/><text x="631.7" y="372" font-size="13" fill="#1f2937" text-anchor="middle">10</text><line x1="100" y1="350" x2="680" y2="350" stroke="#9ca3af" stroke-width="1.5"/><line x1="100" y1="70" x2="100" y2="350" stroke="#9ca3af" stroke-width="1.5"/><text x="390" y="396" font-size="14" fill="#1f2937" text-anchor="middle">PEEP (cmH₂O) en la prueba decremental →</text><text x="48" y="210" font-size="14" fill="#1f2937" text-anchor="middle" transform="rotate(-90 48 210)">Compliance (mL/cmH₂O)</text><text x="360" y="36" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Compliance en una prueba decremental de PEEP</text><polyline points="148.3,256.7 245,224.9 341.7,148.4 438.3,126 535,148.4 631.7,224.9" fill="none" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/><circle cx="148.3" cy="256.7" r="5" fill="#1f2937"/><circle cx="245" cy="224.9" r="5" fill="#1f2937"/><circle cx="341.7" cy="148.4" r="5" fill="#1f2937"/><circle cx="438.3" cy="126" r="8" fill="#15803d"/><circle cx="535" cy="148.4" r="5" fill="#1f2937"/><circle cx="631.7" cy="224.9" r="5" fill="#1f2937"/><text x="114.5" y="98" font-size="14" fill="#b91c1c" font-weight="600">Predomina la</text><text x="114.5" y="116" font-size="14" fill="#b91c1c" font-weight="600">sobredistensión</text><text x="665.5" y="98" font-size="14" fill="#1d4ed8" text-anchor="end" font-weight="600">Predomina</text><text x="665.5" y="116" font-size="14" fill="#1d4ed8" text-anchor="end" font-weight="600">el colapso</text><text x="438.3" y="108" font-size="14" fill="#15803d" text-anchor="middle" font-weight="600">Máxima compliance</text><text x="438.3" y="90" font-size="14" fill="#15803d" text-anchor="middle">PEEP 14 cmH₂O</text><text x="100" y="420" font-size="13" fill="#1f2937">Datos del ejemplo resuelto de la lección (Vt 400 mL constante). Valores ilustrativos.</text>
</svg>
