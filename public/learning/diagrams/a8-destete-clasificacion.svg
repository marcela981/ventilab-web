<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Clasificaciones del destete</title>
<desc id="d">Comparación de dos clasificaciones. Arriba, la conferencia de consenso de 2007 basada en pruebas de ventilación espontánea: simple, éxito en la primera prueba; difícil, hasta tres pruebas o hasta siete días; prolongado, más de tres pruebas o más de siete días. Abajo, el estudio WIND desde el primer intento de separación: grupo 1, menos de 24 horas, 57 por ciento de los pacientes y mortalidad del 6 por ciento; grupo 2, de 1 a 7 días, 10 por ciento y mortalidad del 17 por ciento; grupo 3, 7 días o más, 9 por ciento y mortalidad del 29 por ciento, con barras de mortalidad. El 24 por ciento nunca inició un intento de separación.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<text x="360" y="30" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Dos formas de clasificar el destete</text><text x="40" y="62" font-size="15" fill="#1f2937" text-anchor="start" font-weight="600">Conferencia de consenso (Boles et al., 2007): según las PVE</text><rect x="40" y="75" width="200" height="85" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="140" y="100" font-size="15" fill="#15803d" text-anchor="middle" font-weight="600">Simple</text><text x="140" y="124" font-size="14" fill="#1f2937" text-anchor="middle">Éxito en la</text><text x="140" y="143" font-size="14" fill="#1f2937" text-anchor="middle">primera PVE</text><rect x="260" y="75" width="200" height="85" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="360" y="100" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="600">Difícil</text><text x="360" y="124" font-size="14" fill="#1f2937" text-anchor="middle">Hasta 3 PVE o</text><text x="360" y="143" font-size="14" fill="#1f2937" text-anchor="middle">hasta 7 días</text><rect x="480" y="75" width="200" height="85" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="580" y="100" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="600">Prolongado</text><text x="580" y="124" font-size="14" fill="#1f2937" text-anchor="middle">Más de 3 PVE o</text><text x="580" y="143" font-size="14" fill="#1f2937" text-anchor="middle">más de 7 días</text><text x="40" y="200" font-size="15" fill="#1f2937" text-anchor="start" font-weight="600">WIND (Béduneau et al., 2017): desde el primer intento de separación</text><rect x="40" y="212" width="200" height="80" rx="8" fill="#f3f4f6" stroke="#15803d" stroke-width="1.5"/><text x="140" y="236" font-size="14" fill="#15803d" text-anchor="middle" font-weight="600">Grupo 1: menos de 24 h</text><text x="140" y="258" font-size="14" fill="#1f2937" text-anchor="middle">57 % de los pacientes</text><text x="140" y="280" font-size="14" fill="#1f2937" text-anchor="middle">mortalidad 6 %</text><rect x="110" y="382" width="60" height="18" rx="2" fill="#15803d" stroke="none" stroke-width="1.5"/><text x="140" y="376" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">6 %</text><rect x="260" y="212" width="200" height="80" rx="8" fill="#f3f4f6" stroke="#1d4ed8" stroke-width="1.5"/><text x="360" y="236" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="600">Grupo 2: 1 a 7 días</text><text x="360" y="258" font-size="14" fill="#1f2937" text-anchor="middle">10 % de los pacientes</text><text x="360" y="280" font-size="14" fill="#1f2937" text-anchor="middle">mortalidad 17 %</text><rect x="330" y="349" width="60" height="51" rx="2" fill="#1d4ed8" stroke="none" stroke-width="1.5"/><text x="360" y="343" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">17 %</text><rect x="480" y="212" width="200" height="80" rx="8" fill="#f3f4f6" stroke="#b91c1c" stroke-width="1.5"/><text x="580" y="236" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="600">Grupo 3: 7 días o más</text><text x="580" y="258" font-size="14" fill="#1f2937" text-anchor="middle">9 % de los pacientes</text><text x="580" y="280" font-size="14" fill="#1f2937" text-anchor="middle">mortalidad 29 %</text><rect x="550" y="313" width="60" height="87" rx="2" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="580" y="307" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">29 %</text><line x1="40" y1="400" x2="680" y2="400" stroke="#9ca3af" stroke-width="1.5"/><text x="360" y="422" font-size="14" fill="#1f2937" text-anchor="middle">Mortalidad por grupo · el 24 % de los pacientes nunca inició un intento de separación</text><text x="360" y="448" font-size="13" fill="#1f2937" text-anchor="middle">PVE: prueba de ventilación espontánea</text>
</svg>
