<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Ajuste ciclo a ciclo de la presión en un modo de volumen objetivo con presión adaptativa</title>
<desc id="d">Diagrama esquemático de doce ciclos. Arriba, barras de volumen corriente entregado frente a una línea de volumen objetivo. Abajo, la presión inspiratoria aplicada en cada ciclo. Tras una caída de la compliance en el ciclo 4 el volumen cae por debajo del objetivo y el ventilador sube la presión en escalones durante varios ciclos hasta recuperarlo. En el ciclo 9 el paciente hace un esfuerzo inspiratorio intenso, el volumen supera el objetivo y el ventilador reduce la presión en los ciclos siguientes, de modo que el soporte disminuye justo cuando la demanda del paciente aumenta.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<text x="360" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">PRVC / VC+: el ventilador ajusta la presión para alcanzar el volumen objetivo</text>
<!-- top panel -->
<line x1="80" y1="50" x2="80" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="80" y1="220" x2="690" y2="220" stroke="#9ca3af" stroke-width="1.5"/>
<text x="30" y="135" font-size="14" fill="#1f2937" transform="rotate(-90 30 135)" text-anchor="middle">Vt entregado (mL)</text>
<line x1="80" y1="100" x2="690" y2="100" stroke="#15803d" stroke-width="2" stroke-dasharray="8 5"/>
<text x="686" y="94" text-anchor="end" font-size="14" fill="#15803d">Vt objetivo</text>
<g fill="#1d4ed8">
<rect x="96" y="100" width="30" height="120"/>
<rect x="146" y="100" width="30" height="120"/>
<rect x="196" y="100" width="30" height="120"/>
<rect x="246" y="150" width="30" height="70"/>
<rect x="296" y="138" width="30" height="82"/>
<rect x="346" y="124" width="30" height="96"/>
<rect x="396" y="110" width="30" height="110"/>
