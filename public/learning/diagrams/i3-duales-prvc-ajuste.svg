</g>
<text x="261" y="140" text-anchor="middle" font-size="14" fill="#b91c1c">↓ compliance</text>
<text x="511" y="58" text-anchor="middle" font-size="14" fill="#c2410c">esfuerzo intenso</text>
<!-- bottom panel -->
<line x1="80" y1="250" x2="80" y2="420" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="80" y1="420" x2="690" y2="420" stroke="#9ca3af" stroke-width="1.5"/>
<text x="30" y="335" font-size="14" fill="#1f2937" transform="rotate(-90 30 335)" text-anchor="middle">P inspiratoria (cmH₂O)</text>
