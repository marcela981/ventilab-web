<g fill="#6d28d9">
<circle cx="111" cy="360" r="4"/><circle cx="161" cy="360" r="4"/><circle cx="211" cy="360" r="4"/><circle cx="261" cy="360" r="4"/>
<circle cx="311" cy="340" r="4"/><circle cx="361" cy="322" r="4"/><circle cx="411" cy="306" r="4"/><circle cx="461" cy="300" r="4"/>
<circle cx="511" cy="300" r="4"/><circle cx="561" cy="318" r="4"/><circle cx="611" cy="334" r="4"/><circle cx="661" cy="344" r="4"/>
</g>
