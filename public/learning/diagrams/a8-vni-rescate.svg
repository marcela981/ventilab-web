<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">VNI de rescate tras la extubación</title>
<desc id="d">Tres gráficos de barras del ensayo de Esteban y colaboradores de 2004 en pacientes con insuficiencia respiratoria en las 48 horas siguientes a la extubación. Reintubación: 48 por ciento con ventilación no invasiva y 48 por ciento con tratamiento estándar. Mortalidad en la UCI: 25 por ciento frente a 14 por ciento. Mediana del tiempo hasta la reintubación: 12 horas frente a 2,5 horas. El texto concluye que la ventilación no invasiva no evitó la reintubación, la retrasó y se asoció con mayor mortalidad.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<text x="360" y="30" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">VNI de rescate frente a tratamiento estándar</text><text x="360" y="52" font-size="13" fill="#1f2937" text-anchor="middle">Insuficiencia respiratoria en las 48 h siguientes a la extubación (Esteban et al., 2004)</text><text x="145" y="85" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">Reintubación</text><line x1="50" y1="320" x2="240" y2="320" stroke="#9ca3af" stroke-width="1.5"/><rect x="75" y="152" width="60" height="168" rx="2" fill="#c2410c" stroke="none" stroke-width="1.5"/><text x="105" y="146" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">48 %</text><rect x="155" y="152" width="60" height="168" rx="2" fill="#1d4ed8" stroke="none" stroke-width="1.5"/><text x="185" y="146" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">48 %</text><text x="105" y="340" font-size="13" fill="#1f2937" text-anchor="middle">VNI</text><text x="185" y="340" font-size="13" fill="#1f2937" text-anchor="middle">Estándar</text><text x="145" y="360" font-size="13" fill="#1f2937" text-anchor="middle">%</text><text x="370" y="85" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">Mortalidad en UCI</text><line x1="275" y1="320" x2="465" y2="320" stroke="#9ca3af" stroke-width="1.5"/><rect x="300" y="232.5" width="60" height="87.5" rx="2" fill="#c2410c" stroke="none" stroke-width="1.5"/><text x="330" y="226.5" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">25 %</text><rect x="380" y="271" width="60" height="49" rx="2" fill="#1d4ed8" stroke="none" stroke-width="1.5"/><text x="410" y="265" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">14 %</text><text x="330" y="340" font-size="13" fill="#1f2937" text-anchor="middle">VNI</text><text x="410" y="340" font-size="13" fill="#1f2937" text-anchor="middle">Estándar</text><text x="370" y="360" font-size="13" fill="#1f2937" text-anchor="middle">%</text><text x="595" y="85" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">Tiempo hasta reintubación</text><line x1="500" y1="320" x2="690" y2="320" stroke="#9ca3af" stroke-width="1.5"/><rect x="525" y="152" width="60" height="168" rx="2" fill="#c2410c" stroke="none" stroke-width="1.5"/><text x="555" y="146" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">12 h</text><rect x="605" y="285" width="60" height="35" rx="2" fill="#1d4ed8" stroke="none" stroke-width="1.5"/><text x="635" y="279" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">2,5 h</text><text x="555" y="340" font-size="13" fill="#1f2937" text-anchor="middle">VNI</text><text x="635" y="340" font-size="13" fill="#1f2937" text-anchor="middle">Estándar</text><text x="595" y="360" font-size="13" fill="#1f2937" text-anchor="middle">h (mediana)</text><text x="360" y="385" font-size="14" fill="#1f2937" text-anchor="middle">La VNI no evitó la reintubación, la retrasó y se asoció con mayor mortalidad en la UCI.</text><text x="360" y="405" font-size="13" fill="#1f2937" text-anchor="middle">Barras naranjas: VNI de rescate · barras azules: tratamiento estándar</text>
</svg>
