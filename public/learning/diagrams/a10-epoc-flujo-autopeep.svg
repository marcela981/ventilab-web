<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d">
<title id="t">Curva de flujo en el tiempo con y sin atrapamiento aéreo</title>
<desc id="d">Dos curvas de flujo frente a tiempo en ventilación controlada por volumen con flujo constante. Arriba, frecuencia alta y tiempo espiratorio corto: el flujo espiratorio no regresa a cero antes de la siguiente inspiración, signo de auto-PEEP. Abajo, tras reducir la frecuencia y alargar el tiempo espiratorio: el flujo espiratorio llega a cero antes de cada inspiración.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<line x1="80" y1="120" x2="690" y2="120" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="80" y1="40" x2="80" y2="200" stroke="#9ca3af" stroke-width="1.5"/>
<text x="72" y="59" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1f2937" text-anchor="end">+60</text>
<text x="72" y="125" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1f2937" text-anchor="end">0</text>
<text x="72" y="191" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1f2937" text-anchor="end">−60</text>
<text x="690" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1f2937" text-anchor="end">Tiempo (s)</text>
<text x="90" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#b91c1c" font-weight="bold">FR 30/min, Te 1,2 s: el flujo espiratorio no llega a cero (auto-PEEP)</text>
<circle cx="280" cy="138" r="5" fill="none" stroke="#b91c1c" stroke-width="2"/>
<circle cx="480" cy="138" r="5" fill="none" stroke="#b91c1c" stroke-width="2"/>
