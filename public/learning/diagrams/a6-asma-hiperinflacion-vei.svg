<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Hiperinflación dinámica y volumen al final de la inspiración</title>
<desc id="d">Gráfica de volumen pulmonar frente al tiempo en un paciente con asma grave ventilado en modo controlado. Las respiraciones se apilan sobre la capacidad residual funcional porque el tiempo espiratorio no alcanza para exhalar todo el volumen. Después se realiza una apnea prolongada: el paciente exhala lentamente todo el gas atrapado hasta la capacidad residual funcional. El volumen total exhalado durante la apnea es el volumen al final de la inspiración, VEI, que suma el volumen corriente y el volumen atrapado.</desc>
