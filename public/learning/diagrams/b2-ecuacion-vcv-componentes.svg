<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-labelledby="t d">
<title id="t">Componentes de la presión en VCV</title>
<desc id="d">Curvas de flujo y presión en el tiempo durante ventilación controlada por volumen con flujo constante y pausa inspiratoria. El flujo es cuadrado en la inspiración, cero en la pausa y negativo y decreciente en la espiración. La presión parte de la PEEP, salta al iniciar el flujo por el componente resistivo, sube en rampa hasta la presión pico y, al detenerse el flujo, cae a la presión meseta. La diferencia entre pico y meseta es el componente resistivo y la diferencia entre meseta y PEEP es el componente elástico o driving pressure.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
</defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" font-size="14">
<text x="360" y="30" font-size="18" text-anchor="middle" font-weight="700">VCV con flujo constante y pausa inspiratoria</text>
<line x1="90" y1="50" x2="90" y2="190" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="90" y1="125" x2="690" y2="125" stroke="#9ca3af" stroke-width="1.5"/>
<text x="96" y="50" font-size="13">Flujo (L/min)</text>
<text x="80" y="80" font-size="13" text-anchor="end">+60</text>
<text x="80" y="130" font-size="13" text-anchor="end">0</text>
<path d="M90,125 L120,125 L120,75 L300,75 L300,125 L360,125 L362,182 C400,150 450,130 560,125 L640,125 L640,75 L690,75" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/>
<text x="210" y="68" font-size="13" text-anchor="middle" fill="#1d4ed8">flujo inspiratorio constante</text>
<text x="330" y="112" font-size="13" text-anchor="middle">pausa</text>
<text x="470" y="175" font-size="13" text-anchor="start" fill="#1d4ed8">flujo espiratorio (pasivo)</text>
<line x1="90" y1="215" x2="90" y2="420" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="90" y1="420" x2="690" y2="420" stroke="#9ca3af" stroke-width="1.5"/>
<text x="96" y="212" font-size="13">Presión (cmH₂O)</text>
<text x="80" y="425" font-size="13" text-anchor="end">0</text>
<line x1="90" y1="420" x2="690" y2="420" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 5"/>
<text x="80" y="395" font-size="13" text-anchor="end">5</text>
<line x1="90" y1="390" x2="690" y2="390" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 5"/>
<text x="80" y="335" font-size="13" text-anchor="end">15</text>
<line x1="90" y1="330" x2="690" y2="330" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 5"/>
<text x="80" y="275" font-size="13" text-anchor="end">25</text>
<line x1="90" y1="270" x2="690" y2="270" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 5"/>
<path d="M90,390 L120,390 L122,330 L300,270 L304,330 L360,330 C368,384 385,390 410,390 L640,390 L642,330 L690,313.2" fill="none" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
<line x1="108" y1="420" x2="108" y2="390" stroke="#c2410c" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="118" y="412.8" font-size="13" fill="#c2410c" font-weight="700">PEEP</text>
<line x1="140" y1="390" x2="140" y2="330" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="146" y="357" font-size="13" fill="#1d4ed8">R·V̇ (salto inicial)</text>
<line x1="330" y1="390" x2="330" y2="330" stroke="#15803d" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="324" y="363" font-size="14" text-anchor="end" fill="#15803d" font-weight="700">V/C = ΔP</text>
<text x="300" y="260" text-anchor="middle" font-weight="700">Ppico</text>
<text x="372" y="322" text-anchor="start" font-weight="700">Pmeseta</text>
<line x1="312" y1="270" x2="312" y2="330" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="318" y="297" font-size="13" fill="#1d4ed8" font-weight="700">R·V̇</text>
<text x="520" y="288" font-size="13" text-anchor="middle">Ppico − Pmeseta = componente resistivo</text>
<text x="520" y="303" font-size="13" text-anchor="middle">Pmeseta − PEEP = componente elástico</text>
<text x="690" y="448" font-size="13" text-anchor="end">Tiempo (s)</text>
</g>
</svg>
