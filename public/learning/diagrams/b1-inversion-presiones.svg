<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="t d">
<title id="t">Presiones alveolar y pleural: respiración espontánea frente a presión positiva</title>
<desc id="d">Dos paneles con presión en cmH₂O frente al tiempo. A la izquierda, respiración espontánea: durante la inspiración la presión pleural pasa de unos −5 a unos −8 cmH₂O y la presión alveolar baja ligeramente por debajo de cero; en la espiración la presión alveolar es ligeramente positiva. A la derecha, ventilación con presión positiva en un paciente pasivo: la presión alveolar sube por encima de cero durante la inspiración y la presión pleural también aumenta, en lugar de hacerse más negativa. Valores ilustrativos.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937">
<text x="205" y="40" font-size="16" font-weight="bold" text-anchor="middle">Respiración espontánea</text>
<text x="555" y="40" font-size="16" font-weight="bold" text-anchor="middle">Presión positiva (paciente pasivo)</text>
<rect x="70" y="70" width="101" height="340" fill="#f3f4f6"/>
<rect x="420" y="70" width="101" height="340" fill="#f3f4f6"/>
<text x="120" y="88" font-size="13" text-anchor="middle">Inspiración</text>
<text x="255" y="88" font-size="13" text-anchor="middle">Espiración</text>
<text x="470" y="88" font-size="13" text-anchor="middle">Inspiración</text>
<text x="605" y="88" font-size="13" text-anchor="middle">Espiración</text>
<g stroke="#9ca3af" stroke-width="1">
<line x1="70" y1="100" x2="340" y2="100" stroke-dasharray="3 4"/>
<line x1="70" y1="160" x2="340" y2="160" stroke-dasharray="3 4"/>
<line x1="70" y1="220" x2="340" y2="220" stroke-dasharray="3 4"/>
<line x1="70" y1="340" x2="340" y2="340" stroke-dasharray="3 4"/>
<line x1="70" y1="400" x2="340" y2="400" stroke-dasharray="3 4"/>
<line x1="420" y1="100" x2="690" y2="100" stroke-dasharray="3 4"/>
<line x1="420" y1="160" x2="690" y2="160" stroke-dasharray="3 4"/>
<line x1="420" y1="220" x2="690" y2="220" stroke-dasharray="3 4"/>
<line x1="420" y1="340" x2="690" y2="340" stroke-dasharray="3 4"/>
<line x1="420" y1="400" x2="690" y2="400" stroke-dasharray="3 4"/>
</g>
<line x1="70" y1="70" x2="70" y2="410" stroke="#9ca3af" stroke-width="2"/>
<line x1="70" y1="280" x2="340" y2="280" stroke="#9ca3af" stroke-width="2"/>
<line x1="420" y1="70" x2="420" y2="410" stroke="#9ca3af" stroke-width="2"/>
<line x1="420" y1="280" x2="690" y2="280" stroke="#9ca3af" stroke-width="2"/>
<g font-size="13" text-anchor="end">
<text x="64" y="105">15</text>
<text x="64" y="165">10</text>
<text x="64" y="225">5</text>
<text x="64" y="285">0</text>
<text x="64" y="345">−5</text>
<text x="64" y="405">−10</text>
<text x="414" y="105">15</text>
<text x="414" y="165">10</text>
<text x="414" y="225">5</text>
<text x="414" y="285">0</text>
<text x="414" y="345">−5</text>
<text x="414" y="405">−10</text>
</g>
<text x="22" y="240" font-size="13" text-anchor="middle" transform="rotate(-90 22 240)">Presión (cmH₂O)</text>
<text x="205" y="440" font-size="14" text-anchor="middle">Tiempo</text>
<text x="555" y="440" font-size="14" text-anchor="middle">Tiempo</text>
<path d="M70,280 C95,293 125,293 171,280 C195,267 225,267 272,280 L340,280" fill="none" stroke="#1d4ed8" stroke-width="3"/>
<path d="M70,340 C110,344 140,376 171,376 C210,376 240,344 272,340 L340,340" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="8 5"/>
<path d="M420,280 L521,136 C545,232 580,276 622,279 L690,280" fill="none" stroke="#1d4ed8" stroke-width="3"/>
