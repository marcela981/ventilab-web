<text x="180" y="262" font-size="14" fill="#1d4ed8">Alveolar: cerca de 0</text>
<text x="180" y="395" font-size="14" fill="#c2410c">Pleural: más negativa</text>
<text x="528" y="132" font-size="14" fill="#1d4ed8">Alveolar: positiva</text>
<text x="540" y="252" font-size="14" fill="#c2410c">Pleural: sube</text>
<text x="360" y="466" font-size="14" text-anchor="middle">Línea continua: presión alveolar. Línea discontinua: presión pleural. Valores ilustrativos.</text>
