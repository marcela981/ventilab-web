<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">Espectro de la relación ventilación-perfusión</title>
<desc id="d">Tres unidades alveolocapilares lado a lado. A la izquierda, una unidad con perfusión pero sin ventilación (relación V/Q igual a cero, cortocircuito): la sangre sale con las presiones de la sangre venosa mixta, PO2 cercana a 40 y PCO2 cercana a 45 milímetros de mercurio. En el centro, una unidad con ventilación y perfusión equilibradas: PO2 cercana a 100 y PCO2 cercana a 40. A la derecha, una unidad ventilada sin perfusión (relación V/Q infinita, espacio muerto alveolar): el gas conserva la composición del aire inspirado humidificado, PO2 cercana a 150 y PCO2 cercana a 0. Una flecha inferior indica que al aumentar la relación V/Q la PO2 sube y la PCO2 baja.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<defs><marker id="m" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f2937"/></marker></defs>
<text x="360" y="32" font-size="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" text-anchor="middle" font-weight="600">Del cortocircuito al espacio muerto</text>
<rect x="20" y="52" width="210" height="262" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="125" y="76" font-size="15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" font-weight="600" fill="#b91c1c">V/Q = 0</text>
<text x="125" y="96" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" text-anchor="middle">Cortocircuito (shunt)</text>
<rect x="117" y="106" width="16" height="44" fill="#9ca3af" stroke="#1f2937"/>
<text x="139" y="132" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" >vía ocluida</text>
<circle cx="125" cy="190" r="44" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<rect x="35" y="238" width="180" height="16" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" />
<text x="125" y="280" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" text-anchor="middle">PO₂ ≈ 40 mmHg</text>
<text x="125" y="300" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" text-anchor="middle">PCO₂ ≈ 45 mmHg</text>
<rect x="255" y="52" width="210" height="262" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="360" y="76" font-size="15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" font-weight="600" fill="#15803d">V/Q equilibrada</text>
<text x="360" y="96" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" text-anchor="middle">Unidad ideal</text>
<rect x="352" y="106" width="16" height="44" fill="#ffffff" stroke="#1f2937"/>
<circle cx="360" cy="190" r="44" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<rect x="270" y="238" width="180" height="16" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" />
<text x="360" y="280" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" text-anchor="middle">PO₂ ≈ 100 mmHg</text>
<text x="360" y="300" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" text-anchor="middle">PCO₂ ≈ 40 mmHg</text>
<rect x="490" y="52" width="210" height="262" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="595" y="76" font-size="15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" font-weight="600" fill="#1d4ed8">V/Q = ∞</text>
<text x="595" y="96" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" text-anchor="middle">Espacio muerto alveolar</text>
<rect x="587" y="106" width="16" height="44" fill="#ffffff" stroke="#1f2937"/>
<circle cx="595" cy="190" r="44" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<rect x="505" y="238" width="180" height="16" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/>
<text x="595" y="251" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" text-anchor="middle">sin flujo</text>
<text x="595" y="280" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" text-anchor="middle">PO₂ ≈ 150 mmHg</text>
<text x="595" y="300" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" text-anchor="middle">PCO₂ ≈ 0 mmHg</text>
<line x1="40" y1="344" x2="676" y2="344" stroke="#1f2937" stroke-width="2.5" marker-end="url(#m)"/>
<text x="360" y="370" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" text-anchor="middle">Relación V/Q creciente: la PO₂ de la unidad sube y la PCO₂ baja</text>
<text x="360" y="392" font-size="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937" text-anchor="middle" font-style="italic">Valores aproximados respirando aire a nivel del mar</text>
</svg>
