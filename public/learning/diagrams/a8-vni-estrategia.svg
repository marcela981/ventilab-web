<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Soporte posextubación según riesgo</title>
<desc id="d">Diagrama de decisión. Tras superar la prueba de ventilación espontánea y extubar, se estima el riesgo de fracaso. Bajo riesgo: cánula nasal de alto flujo en lugar de oxígeno convencional en pacientes no quirúrgicos. Alto riesgo: ventilación no invasiva preventiva inmediata, que puede alternarse con alto flujo, y ventilación no invasiva si hay hipercapnia. Alto riesgo con contraindicación o intolerancia a la ventilación no invasiva: alto flujo como alternativa. Abajo, en rojo: si la insuficiencia respiratoria ya está establecida no se usa la ventilación no invasiva para ganar tiempo y se reintuba sin demora si hay criterios.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><text x="360" y="30" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="600">Soporte tras la extubación según el riesgo</text><rect x="160" y="48" width="400" height="46" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/><text x="360" y="76" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="600">Supera la PVE y se extuba</text><line x1="360" y1="94" x2="360" y2="112" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/><rect x="160" y="114" width="400" height="46" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="360" y="142" font-size="15" fill="#1f2937" text-anchor="middle">Estima el riesgo de fracaso de la extubación</text><line x1="250" y1="160" x2="140" y2="190" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/><line x1="360" y1="160" x2="360" y2="190" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/><line x1="470" y1="160" x2="580" y2="190" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/><rect x="25" y="192" width="210" height="150" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="130" y="216" font-size="15" fill="#15803d" text-anchor="middle" font-weight="600">Bajo riesgo</text><text x="130" y="242" font-size="14" fill="#1f2937" text-anchor="middle">CNAF en lugar de</text><text x="130" y="261" font-size="14" fill="#1f2937" text-anchor="middle">oxígeno convencional</text><text x="130" y="280" font-size="14" fill="#1f2937" text-anchor="middle">(pacientes no</text><text x="130" y="299" font-size="14" fill="#1f2937" text-anchor="middle">quirúrgicos)</text><rect x="255" y="192" width="210" height="150" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="360" y="216" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="600">Alto riesgo</text><text x="360" y="242" font-size="14" fill="#1f2937" text-anchor="middle">VNI preventiva</text><text x="360" y="261" font-size="14" fill="#1f2937" text-anchor="middle">inmediata; puede</text><text x="360" y="280" font-size="14" fill="#1f2937" text-anchor="middle">alternarse con CNAF;</text><text x="360" y="299" font-size="14" fill="#1f2937" text-anchor="middle">hipercapnia: VNI</text><rect x="485" y="192" width="210" height="150" rx="8" fill="#f3f4f6" stroke="#c2410c" stroke-width="1.5"/><text x="590" y="216" font-size="15" fill="#c2410c" text-anchor="middle" font-weight="600">Alto riesgo sin VNI</text><text x="590" y="242" font-size="14" fill="#1f2937" text-anchor="middle">Contraindicación o</text><text x="590" y="261" font-size="14" fill="#1f2937" text-anchor="middle">intolerancia a la VNI:</text><text x="590" y="280" font-size="14" fill="#1f2937" text-anchor="middle">CNAF como</text><text x="590" y="299" font-size="14" fill="#1f2937" text-anchor="middle">alternativa</text><line x1="360" y1="342" x2="360" y2="372" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah)"/><rect x="60" y="374" width="600" height="82" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="360" y="400" font-size="14" fill="#1f2937" text-anchor="middle">Insuficiencia respiratoria ya establecida tras la extubación:</text><text x="360" y="419" font-size="14" fill="#1f2937" text-anchor="middle">no uses la VNI para ganar tiempo; si hay criterios,</text><text x="360" y="438" font-size="14" fill="#1f2937" text-anchor="middle">reintuba sin demora</text><text x="360" y="482" font-size="13" fill="#1f2937" text-anchor="middle">Basado en Ouellette et al. (2017), Rochwerg et al. (2017) y Oczkowski et al. (2022)</text><text x="360" y="502" font-size="13" fill="#1f2937" text-anchor="middle">CNAF: cánula nasal de alto flujo · VNI: ventilación no invasiva · PVE: prueba de ventilación espontánea</text>
</svg>
