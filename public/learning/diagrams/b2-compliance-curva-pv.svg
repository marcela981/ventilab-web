<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Curva presión-volumen estática</title>
<desc id="d">Dos curvas presión-volumen estáticas con forma sigmoidea. La curva de compliance conservada tiene un tramo inicial plano, un punto de inflexión inferior, una zona lineal empinada donde la compliance es máxima, un punto de inflexión superior y un tramo final plano de sobredistensión. La curva de baja compliance es más plana y está desplazada hacia la derecha: el mismo cambio de presión produce mucho menos volumen.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
</defs>
