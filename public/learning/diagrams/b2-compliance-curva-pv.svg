<text x="430" y="75.60000000000002" font-size="13" fill="#6d28d9">sobredistensión: la pendiente cae</text>
<text x="326.5" y="216" font-size="13" fill="#1d4ed8" font-weight="700">zona lineal:</text>
<text x="326.5" y="234" font-size="13" fill="#1d4ed8">máxima compliance (ΔV/ΔP)</text>
<text x="463" y="294" font-size="13" fill="#b91c1c" font-weight="700">pulmón con baja compliance</text>
<text x="463" y="312" font-size="13" fill="#b91c1c">(curva más plana y desplazada)</text>
<text x="140" y="180" font-size="13" fill="#1d4ed8" font-weight="700">compliance conservada</text>
