<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="t d">
<title id="t">Volúmenes y capacidades pulmonares</title>
<desc id="d">Espirograma esquemático de volumen frente al tiempo: respiraciones corrientes, una inspiración máxima hasta la capacidad pulmonar total y una espiración máxima hasta el volumen residual, seguidas de nuevas respiraciones corrientes. A la derecha, corchetes señalan los volúmenes (reserva inspiratoria, corriente, reserva espiratoria y residual) y las capacidades (pulmonar total, vital y residual funcional). El volumen residual no se moviliza y no puede medirse con espirometría. Proporciones ilustrativas.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937">
<rect x="60" y="420" width="500" height="40" fill="#f3f4f6"/>
<text x="310" y="446" font-size="14" text-anchor="middle">Volumen residual: no se moviliza (no lo mide la espirometría)</text>
<g stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4">
