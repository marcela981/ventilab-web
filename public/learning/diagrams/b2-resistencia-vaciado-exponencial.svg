<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d">
<title id="t">Vaciado espiratorio exponencial y constante de tiempo</title>
<desc id="d">Curva exponencial del volumen que queda por exhalar en función del tiempo espiratorio expresado en constantes de tiempo. Tras una constante de tiempo se ha exhalado el 63 por ciento del volumen, tras tres el 95 por ciento y tras cinco el 99 por ciento. Una segunda curva discontinua, con una constante de tiempo 2,5 veces mayor, todavía conserva cerca de un 30 por ciento del volumen cuando comienza la siguiente inspiración a las tres constantes de tiempo normales, lo que genera atrapamiento aéreo y auto-PEEP.</desc>
