<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 445" width="720" height="445" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Gradiente de aireación en supino y prono</title>
<desc id="d">Gráfico de aireación regional relativa frente a la posición entre el esternón y las vértebras. La curva roja continua de supino empieza alta junto al esternón y desciende de forma marcada hacia las vértebras. La curva azul discontinua de prono es casi horizontal, lo que indica una distribución del gas más homogénea.</desc>
