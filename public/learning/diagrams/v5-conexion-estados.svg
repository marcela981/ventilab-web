<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d">
  <title id="t">Estados de la conexión con el ventilador físico</title>
  <desc id="d">Máquina de estados de la pestaña Conexión. Fila superior: Sin reserva pasa a Reservando al pulsar Reservar ahora, luego a Reservado, y con Conectar a Conectando. Fila inferior: Conectando pasa a Conectado; con Desconectar se llega a Desconectado, que conserva la reserva y permite volver a conectar. Si la reserva o la conexión fallan, el estado es Error con el mensaje del servidor. Liberar cancela la reserva y vuelve a Sin reserva.</desc>
  <rect width="100%" height="100%" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937">
    <rect x="20" y="80" width="140" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="90" y="110" font-size="15" font-weight="600" text-anchor="middle">Sin reserva</text>
    <rect x="200" y="80" width="140" height="50" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="270" y="110" font-size="15" font-weight="600" text-anchor="middle">Reservando…</text>
    <rect x="380" y="80" width="140" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="450" y="110" font-size="15" font-weight="600" text-anchor="middle">Reservado</text>
    <rect x="560" y="80" width="140" height="50" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="630" y="110" font-size="15" font-weight="600" text-anchor="middle">Conectando…</text>
    <rect x="560" y="230" width="140" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="630" y="260" font-size="15" font-weight="600" text-anchor="middle">Conectado</text>
    <rect x="380" y="230" width="140" height="50" rx="8" fill="#f3f4f6" stroke="#1d4ed8" stroke-width="2"/>
    <text x="450" y="260" font-size="15" font-weight="600" text-anchor="middle">Desconectado</text>
    <rect x="200" y="230" width="140" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="270" y="260" font-size="15" font-weight="600" text-anchor="middle">Error</text>

    <line x1="160" y1="105" x2="197" y2="105" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
    <line x1="340" y1="105" x2="377" y2="105" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
    <line x1="520" y1="105" x2="557" y2="105" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
    <text x="180" y="66" font-size="14" text-anchor="middle">Reservar ahora</text>
    <text x="540" y="66" font-size="14" text-anchor="middle">Conectar</text>
    <line x1="630" y1="130" x2="630" y2="227" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
    <line x1="560" y1="255" x2="523" y2="255" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
    <text x="540" y="300" font-size="14" text-anchor="middle">Desconectar</text>
    <line x1="500" y1="230" x2="590" y2="133" stroke="#1f2937" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <text x="560" y="190" font-size="14" text-anchor="end">Conectar de nuevo</text>
    <line x1="270" y1="130" x2="270" y2="227" stroke="#b91c1c" stroke-width="2" marker-end="url(#a)"/>
    <text x="278" y="186" font-size="14" fill="#b91c1c">falla</text>
    <path d="M450,80 C450,30 90,30 90,77" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#a)"/>
    <text x="270" y="30" font-size="14" text-anchor="middle" fill="#c2410c">Liberar (cancela la reserva)</text>

    <rect x="20" y="306" width="520" height="40" rx="8" fill="#f3f4f6"/>
    <text x="34" y="331" font-size="14">Desconectar conserva la reserva; Liberar la termina para todos.</text>
  </g>
</svg>
