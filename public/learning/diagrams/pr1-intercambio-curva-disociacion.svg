<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="t d">
<title id="t">Curva de disociación de la oxihemoglobina</title>
<desc id="d">Gráfica de saturación de la hemoglobina en porcentaje frente a la presión parcial de oxígeno de 0 a 120 milímetros de mercurio. La curva normal es sigmoidea: P50 cercana a 27 milímetros de mercurio, saturación cercana al 75 por ciento a 40 (sangre venosa mixta), cercana al 90 por ciento a 60 y cercana al 97 por ciento a 100, con una meseta en la parte alta. Se muestran una curva desplazada a la derecha (acidosis, hipercapnia, fiebre, aumento de 2,3-DPG; menor afinidad) y otra desplazada a la izquierda (alcalosis, hipocapnia, hipotermia, descenso de 2,3-DPG; mayor afinidad). Curva normal calculada con la ecuación de Severinghaus; los desplazamientos son ilustrativos.</desc>
