<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d">
<title id="t">Gravedad del SDRA según PaO₂/FiO₂ y SpO₂/FiO₂</title>
<desc id="d">Tabla gráfica con cuatro columnas: grave, moderado, leve y sin criterio de hipoxemia. Fila de PaO₂/FiO₂: menor o igual a 100, mayor de 100 hasta 200, mayor de 200 hasta 300 y mayor de 300 mmHg. Fila de SpO₂/FiO₂: menor o igual a 148, mayor de 148 hasta 235, mayor de 235 hasta 315 y mayor de 315. Nota: paciente intubado con PEEP de al menos 5 cmH₂O; el cociente SpO₂/FiO₂ solo es válido con SpO₂ de 97 % o menos. Basado en la definición global de 2024.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1f2937">
  <text x="360" y="32" font-size="18" font-weight="600" text-anchor="middle">Gravedad del SDRA en el paciente intubado</text>
  <rect x="190" y="52" width="125" height="190" fill="#fee2e2"/>
  <rect x="315" y="52" width="125" height="190" fill="#f3f4f6"/>
  <rect x="440" y="52" width="125" height="190" fill="#dbeafe"/>
  <rect x="565" y="52" width="125" height="190" fill="#dcfce7"/>
  <g font-size="15" font-weight="600" text-anchor="middle">
    <text x="252" y="80">Grave</text>
    <text x="377" y="80">Moderado</text>
    <text x="502" y="80">Leve</text>
    <text x="627" y="80">Sin criterio</text>
  </g>
  <line x1="30" y1="96" x2="690" y2="96" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="30" y1="170" x2="690" y2="170" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="30" y1="242" x2="690" y2="242" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="40" y="130" font-size="15" font-weight="600">PaO₂/FiO₂</text>
  <text x="40" y="150" font-size="13">(mmHg)</text>
  <text x="40" y="204" font-size="15" font-weight="600">SpO₂/FiO₂</text>
  <text x="40" y="224" font-size="13">(si SpO₂ ≤ 97 %)</text>
  <g font-size="15" text-anchor="middle">
    <text x="252" y="140">≤ 100</text>
    <text x="377" y="140">&gt; 100 a ≤ 200</text>
    <text x="502" y="140">&gt; 200 a ≤ 300</text>
    <text x="627" y="140">&gt; 300</text>
    <text x="252" y="212">≤ 148</text>
    <text x="377" y="212">&gt; 148 a ≤ 235</text>
    <text x="502" y="212">&gt; 235 a ≤ 315</text>
    <text x="627" y="212">&gt; 315</text>
  </g>
  <text x="360" y="276" font-size="14" text-anchor="middle">Requisito: PEEP de al menos 5 cmH₂O. Sobre 1000 m de altitud, multiplicar por P_B/760.</text>
  <text x="360" y="300" font-size="13" text-anchor="middle">Fuente: definición global de SDRA (Matthay et al., 2024).</text>
  <text x="360" y="318" font-size="13" text-anchor="middle">← peor oxigenación          mejor oxigenación →</text>
</g>
</svg>
