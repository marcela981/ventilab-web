<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">Presión en la vía aérea sin CPAP y con CPAP</title>
<desc id="d">Gráfico de presión en la vía aérea en función del tiempo. Sin CPAP la presión oscila alrededor de cero: baja ligeramente al inspirar y sube al espirar. Con CPAP de 8 cmH2O la misma oscilación ocurre alrededor de 8 cmH2O. El dispositivo no añade presión extra en inspiración: solo desplaza la línea de base.</desc>
