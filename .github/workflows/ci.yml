# Funcionalidad: CI del frontend
# Descripción: En cada push y pull request a master instala dependencias, ejecuta typecheck, lint, las pruebas
#   de vitest en 6 lotes (--maxWorkers=2), el build de producción, knip y la verificación del contrato OpenAPI
#   contra el repositorio del backend (clonado en una subcarpeta y leído con BACKEND_SPEC_PATH). Si el backend es
#   privado, el secreto BACKEND_REPO_TOKEN debe tener permiso de lectura sobre marcela981/ventylab-server.
#   v1.1 (A7): sin DATABASE_URL de marcador; la web ya no tiene Prisma.
#   v1.2 (W1 Bloque 1): el lote (d) incluye la feature simulator-workspace.
#   v1.3 (Bloque 5, Ola 0): nuevo job e2e que levanta el stack completo dentro del runner (PostgreSQL 17 como servicio,
#   ventylab-server@main migrado y sembrado como en LOCAL_STACK.md §3.3, backend en :4000 contra el LLM falso
#   scripts/e2e/fake-llm.mjs, web con next start en :3000) y ejecuta solo los cinco E2E críticos con Chromium:
#   simulador digital (simulator-student: sesión simulada, curvas, resultado y repetición; sin MQTT, a diferencia de
#   simulator-connection), lección (bloque2/learning-student: visor, avance y Mi Progreso), quiz
#   (bloque3/quiz-feedback: retroalimentación inmediata y de IA del LLM falso), calificación docente
#   (bloque3/workshop-review: el docente califica la respuesta abierta en /grading y se publica la nota) y panel
#   (bloque4/teacher-student-detail: panel docente y detalle del estudiante). Las demás specs quedan fuera por costo
#   (exam-autosubmit espera su minuto real) o por depender de servicios ausentes en CI (MQTT, Supabase). Los dos
#   repositorios se clonan en carpetas hermanas (web/ y server/) para que el build de la web no vea el backend. Si
#   falla, se suben test-results/ (trazas y capturas) y los logs del stack como artefacto.
#   v1.4 (Bloque 5): el job e2e suma los E2E del Monitoreo de julio (disposición digital, tarjetas persistentes,
#   drawer de Asesoría IA y teclado) y del sidebar colapsable. monitoreo-orden y capturas quedan fuera (reserva del
#   ventilador y capturas solo con E2E_CAPTURES=1).
#   v1.5 (ajustes B): el job e2e usa la rama homónima del backend si existe (PRs cruzados; si no, main), importa el
#   currículo con prisma/import-curriculum.ts cuando el backend lo trae y suma los E2E del currículo y de la auditoría de
#   render de lecciones (se omiten solos si el backend no tiene el currículo importado). THROTTLE_LIMIT global sube a
#   1000/min porque todas las specs comparten la IP del runner; el límite de inicio de sesión no cambia.
# Versión: 1.5
# Autor: Marcela Mazo Castro
# Proyecto: VentyLab
# Tesis: Desarrollo de una aplicación web para la enseñanza de mecánica ventilatoria que integre un sistema de retroalimentación usando modelos de lenguaje
# Institución: Universidad del Valle
# Contacto: marcela.mazo@correounivalle.edu.co

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (a) admin-console, ai-chat, auth, case-editor, content-editor, evaluation-authoring, evaluations
        run: npx vitest run src/features/admin-console src/features/ai-chat src/features/auth src/features/case-editor src/features/content-editor src/features/evaluation-authoring src/features/evaluations --maxWorkers=2

      - name: Tests (b) grading, groups, learning
        run: npx vitest run src/features/grading src/features/groups src/features/learning --maxWorkers=2

      - name: Tests (c) notifications, profile, student-space
        run: npx vitest run src/features/notifications src/features/profile src/features/student-space --maxWorkers=2

      - name: Tests (d) simulator, simulator-workspace, ventilator-lab
        run: npx vitest run src/features/simulator src/features/simulator-workspace src/features/ventilator-lab --maxWorkers=2

      - name: Tests (e) teacher-dashboard, teaching
        run: npx vitest run src/features/teacher-dashboard src/features/teaching --maxWorkers=2

      - name: Tests (f) shared, scripts, config
        run: npx vitest run src/shared scripts config --maxWorkers=2

      - name: Build
        run: npm run build

      - name: Knip (unused files, exports and dependencies)
        run: npx --yes knip@5 --no-progress --no-gitignore

      - name: Checkout backend contract
        uses: actions/checkout@v4
        with:
          repository: marcela981/ventylab-server
          path: .ci/ventylab-server
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          sparse-checkout: openapi
          persist-credentials: false

      - name: API contract check
        env:
          BACKEND_SPEC_PATH: .ci/ventylab-server/openapi/openapi.json
        run: npm run check:api

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ventylab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Backend: local, non-secret values of LOCAL_STACK.md §3.2. NODE_ENV=development goes only on the backend
      # steps: at job level it also reaches next build and breaks its prerendering.
      PORT: "4000"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ventylab
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ventylab
      JWT_SECRET: ci-e2e-access-secret-not-for-production-0001
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-not-for-production-0002
      JWT_REFRESH_EXPIRES_IN: 7d
      SUPERADMIN_EMAIL: superadmin@ventylab.demo
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      PRODUCTION_URL: https://ventylab.vercel.app
      THROTTLE_TTL: "60000"
      # Global per-IP limit: every spec shares the runner IP, and the curriculum walks read hundreds of pages (the 5/min sign-in limit is separate and unchanged).
      THROTTLE_LIMIT: "1000"
      SWAGGER_ALLOWED_IPS: "*"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@ventylab.demo
      SMTP_SECURE: "false"
      OPENAI_BASE_URL: http://127.0.0.1:4910/v1
      OPENAI_API_KEY: local
      # Web and Playwright.
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
      CSP_REPORT_ONLY: "true"
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:4000
    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          path: web

      - name: Resolve backend branch
        id: backend-ref
        env:
          TOKEN: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/marcela981/ventylab-server.git" "$BRANCH" > /dev/null 2>&1; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: marcela981/ventylab-server
          ref: ${{ steps.backend-ref.outputs.ref }}
          path: server
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Migrate and seed the database (LOCAL_STACK.md §3.3)
        working-directory: server
        env:
          NODE_ENV: development
          PGPASSWORD: postgres
        run: |
          npx prisma migrate deploy
          npm run prisma:seed
          psql -h localhost -U postgres -d ventylab -v ON_ERROR_STOP=1 -c 'UPDATE levels lv SET "sectionId" = s.id FROM sections s WHERE lv."sectionId" IS NULL AND s.slug = lv.track'
          npm run demo:seed
          npx tsx prisma/seed-clinical-cases.ts
          npx tsx prisma/seed-evaluation.ts
          if [ -f prisma/import-curriculum.ts ]; then npx tsx prisma/import-curriculum.ts --apply --author ana.torres@ventylab.demo; fi

      - name: Build backend
        working-directory: server
        run: npm run build

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Start fake LLM, backend and web
        run: |
          mkdir -p logs
          (cd web && nohup node scripts/e2e/fake-llm.mjs > ../logs/fake-llm.log 2>&1 &)
          (cd server && NODE_ENV=development nohup node dist/main > ../logs/backend.log 2>&1 &)
          (cd web && nohup npx next start -p 3000 > ../logs/web.log 2>&1 &)

      - name: Wait for the stack
        run: |
          wait_for() {
            for i in $(seq 1 90); do
              if curl -sf "$1" > /dev/null; then echo "ready: $1"; return 0; fi
              sleep 2
            done
            echo "not ready: $1"
            return 1
          }
          wait_for http://localhost:4000/health/ready || { tail -n 100 logs/backend.log; exit 1; }
          wait_for http://localhost:3000/auth/login || { tail -n 100 logs/web.log; exit 1; }

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: E2E critical specs
        working-directory: web
        run: >-
          npx playwright test --project=e2e
          e2e/simulator-student.spec.ts
          e2e/bloque2/learning-student.spec.ts
          e2e/bloque3/quiz-feedback.spec.ts
          e2e/bloque3/workshop-review.spec.ts
          e2e/bloque4/teacher-student-detail.spec.ts
          e2e/bloque5/monitoreo-julio.spec.ts
          e2e/bloque5/monitoreo-tarjetas.spec.ts
          e2e/bloque5/monitoreo-ia.spec.ts
          e2e/bloque5/monitoreo-teclado.spec.ts
          e2e/bloque5/sidebar.spec.ts
          e2e/ajustes-b/curriculum-content.spec.ts
          e2e/ajustes-b/render-audit.spec.ts

      - name: Stack logs
        if: failure()
        run: tail -n 200 logs/*.log || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            web/test-results/
            logs/
          retention-days: 7
